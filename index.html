<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26-27 Utah Dawgs Season</title>
<style>
  :root {
    color-scheme: light;
    --maxw:1280px;
    --blue:#184b9a; --blue-2:#2260c4; --blue-dark:#0e2f66; --blue-hi:#6ea8ff;
    --bg:#e7edf7; --card:#ffffff; --card-2:#f3f6fb; --hover:#e4edfb; --line:#d5deee;
    --ink:#0f1a2e; --muted:#5b6b86;
    --win:#16a34a; --loss:#dc2626; --otl:#d97706;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--bg); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); min-height:100vh;
         background:linear-gradient(180deg,#d3e0f5 0px,#e7edf7 380px); }

  /* Ticker */
  .ticker { background:#000; color:#fff; overflow-x:auto; white-space:nowrap; border-bottom:1px solid #111c33; }
  /* Visible steel-blue scroll bar (full blue on hover) so people can tell the game bar scrolls (Chrome, Edge, Safari) */
  .ticker::-webkit-scrollbar { height:10px; }
  .ticker::-webkit-scrollbar-track { background:#1a2336; }
  .ticker::-webkit-scrollbar-thumb { background:#3b5b8c; border-radius:6px; border:2px solid #1a2336; }
  .ticker::-webkit-scrollbar-thumb:hover { background:#2260c4; }
  @supports (-moz-appearance:none) { .ticker { scrollbar-width:thin; scrollbar-color:#3b5b8c #1a2336; } }   /* Firefox */
  /* Fade on the right edge hints there are more games; hidden once scrolled to the end */
  .ticker-wrap { position:relative; }
  .ticker-wrap::after { content:""; position:absolute; top:0; right:0; bottom:10px; width:72px; pointer-events:none;
                        background:linear-gradient(to right, rgba(0,0,0,0), #000); transition:opacity .2s; }
  .ticker-wrap.at-end::after { opacity:0; }
  .ticker-inner { display:inline-flex; padding:0 8px; }
  .tgame { display:inline-block; min-width:158px; padding:10px 16px; border-right:1px solid #111c33; font-size:.78rem; vertical-align:top; }
  .tgame .tdate { color:#7f93b8; font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .tgame .trow { display:flex; justify-content:space-between; gap:12px; font-weight:700; }
  .tgame .trow.dim { color:#8fa2c6; font-weight:500; }
  .tgame .tres { margin-top:4px; font-size:.66rem; font-weight:800; letter-spacing:.05em; }
  .tres.W { color:#22c55e; } .tres.L { color:#f05252; } .tres.OTL { color:#f59e0b; } .tres.T { color:#9ca3af; } .tres.up { color:var(--blue-hi); }
  .tgame.upcoming .up-line { font-weight:700; margin:2px 0; }
  /* Cards with an opponent link to that game's Game Center; a bar appears on hover */
  .tgame.link { position:relative; cursor:pointer; transition:background .15s; }
  .tgame.link:hover { background:#0c1830; }
  .tgame .gc { position:absolute; left:0; right:0; bottom:0; height:30px; display:flex; align-items:center; justify-content:center;
               background:var(--blue); color:#fff; font-size:.66rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
               opacity:0; transition:opacity .15s; }
  .tgame.link:hover .gc { opacity:1; }

  /* Header */
  header { background:#000; color:#fff; border-bottom:3px solid var(--blue); }
  .top { max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:20px; padding:18px 20px; }
  .logo { height:88px; width:auto; max-width:180px; object-fit:contain; flex-shrink:0; }
  .crest { display:none; width:76px; height:76px; border-radius:50%; background:var(--blue); place-items:center; font-weight:800; font-size:1.6rem; letter-spacing:.02em; flex-shrink:0; }
  .brand { flex:1; }
  .brand h1 { font-size:2.1rem; line-height:1.1; font-weight:800; letter-spacing:.01em; }
  .brand p { font-size:.95rem; color:#9db5e0; margin-top:4px; }
  .filter select { background:#000; color:#fff; border:1px solid var(--blue); border-radius:8px; padding:8px 10px; font-size:.82rem; font-weight:600; }
  nav { background:var(--blue); }
  .navin { max-width:var(--maxw); margin:0 auto; display:flex; overflow-x:auto; padding:0 12px; }
  nav button { background:none; border:0; color:rgba(255,255,255,.75); font-size:.82rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
               padding:14px 18px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button:hover { color:#fff; }
  nav button.active { color:#fff; border-bottom-color:#fff; }

  /* Layout */
  main { max-width:var(--maxw); margin:0 auto; padding:22px 20px; }
  .view { display:none; } .view.active { display:block; }
  h2.sec { font-size:.85rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink); border-left:4px solid var(--blue); padding-left:10px; margin:28px 0 12px; }
  h2.sec:first-child { margin-top:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(15,26,46,.08); }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .toolbar input, .toolbar select { padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:.9rem; background:#fff; color:var(--ink); }
  .toolbar input { flex:1 1 260px; max-width:440px; }
  .toolbar input::placeholder { color:var(--muted); }
  .note { font-size:.8rem; color:var(--muted); margin:0 2px 10px; }
  .note.after { margin:8px 2px 0; }
  .abbr { text-decoration:underline dotted; text-decoration-color:rgba(255,255,255,.55); text-underline-offset:3px; cursor:help; }
  .mtile .abbr { text-decoration-color:var(--muted); }
  .note.key { line-height:1.6; }
  .note.key b { color:var(--ink); }

  /* KPI tiles: centered, one-line titles, always a single row (scrolls sideways on small screens) */
  .stats { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:thin; }
  .stat { flex:1 0 auto; text-align:center; background:linear-gradient(160deg,var(--blue) 0%,var(--blue-dark) 100%); color:#fff;
          border-radius:12px; padding:16px 14px; box-shadow:0 4px 14px rgba(24,75,154,.28); }
  .stat .lbl { font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:rgba(255,255,255,.78); white-space:nowrap; }
  .stat .val { font-size:1.75rem; font-weight:800; margin-top:6px; white-space:nowrap; }
  .stat.click { cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .stat.click:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(24,75,154,.38); }
  .stat.click .lbl::after { content:" ›"; }

  /* Leaders (every row uses the same font sizes) */
  .leaders { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
  .leader h3 { background:var(--blue); color:#fff; font-size:.76rem; text-transform:uppercase; letter-spacing:.1em; padding:10px 14px; }
  .lrow { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:.9rem; cursor:pointer; }
  .lrow:hover { background:var(--hover); }
  .lrow:last-child { border-bottom:0; }
  .lrow .rank { min-width:28px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
  .lrow .name { flex:1; font-weight:600; }
  .lrow .num { font-weight:800; font-variant-numeric:tabular-nums; }
  .lrow.first { background:#eaf1fd; }
  .lrow.first:hover { background:var(--hover); }

  /* Tables */
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th { background:var(--blue); color:#fff; text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em;
       padding:11px 14px; cursor:pointer; white-space:nowrap; user-select:none; }
  th:hover { background:var(--blue-2); }
  th .arrow { margin-left:4px; opacity:.85; }
  th.num, td.num { text-align:right; }
  table.ctr th.num, table.ctr td.num { text-align:center; }   /* Stats page: numbers centered under their titles */
  table th.mid, table td.mid { text-align:center; }           /* Columns centered on every page */
  td { padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.txt { font-weight:600; }
  tbody tr:nth-child(even) { background:var(--card-2); }
  tbody tr:hover { background:var(--hover); }
  tr.click { cursor:pointer; }
  .badge { display:inline-block; min-width:36px; text-align:center; padding:2px 8px; border-radius:4px; font-size:.72rem; font-weight:800; color:#fff; }
  .badge.W { background:#16a34a; } .badge.L { background:#dc2626; } .badge.OTL { background:#d97706; } .badge.T { background:#6b7280; }
  .pos { color:var(--win); font-weight:700; } .neg { color:var(--loss); font-weight:700; }
  .msg { padding:36px 20px; text-align:center; color:var(--muted); }
  .err { color:var(--loss); }

  /* Stats page jump links */
  .jump { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .jump a { padding:6px 14px; border:1px solid var(--line); background:#fff; border-radius:999px; font-size:.78rem; font-weight:700; text-decoration:none; color:var(--ink); }
  .jump a:hover { border-color:var(--blue); color:var(--blue); }

  /* Game Center */
  .back { background:none; border:0; color:var(--blue); font-weight:700; font-size:.9rem; cursor:pointer; margin-bottom:12px; padding:4px 0; }
  .back:hover { text-decoration:underline; }
  .gc-hero { background:linear-gradient(135deg,#000 0%,var(--blue-dark) 55%,var(--blue) 100%); color:#fff; border-radius:14px; padding:26px 20px;
             display:flex; align-items:center; justify-content:space-around; gap:16px; box-shadow:0 6px 20px rgba(24,75,154,.3); }
  .gc-team { text-align:center; flex:1; min-width:0; }
  .gc-badge { width:84px; height:84px; border-radius:50%; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.25);
              display:grid; place-items:center; margin:0 auto 10px; overflow:hidden; font-weight:800; font-size:1.4rem; }
  .gc-badge img { width:100%; height:100%; object-fit:contain; }
  .gc-name { font-weight:800; font-size:1.15rem; overflow-wrap:anywhere; }
  .gc-mid { text-align:center; flex:1.2; }
  .gc-status { font-size:.75rem; font-weight:800; letter-spacing:.12em; color:#9db5e0; }
  .gc-score { font-size:2.6rem; font-weight:800; line-height:1.1; margin:6px 0; }
  .gc-meta { font-size:.85rem; color:#c9d6ee; line-height:1.5; }

  /* Roster */
  .roster { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .pcard { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; box-shadow:0 1px 3px rgba(15,26,46,.08); transition:transform .12s, box-shadow .12s, border-color .12s; }
  .pcard:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(24,75,154,.28); border-color:var(--blue-2); }
  .pcard .hd { background:linear-gradient(135deg,#000 0%,var(--blue) 100%); color:#fff; padding:14px; display:flex; justify-content:space-between; align-items:flex-start; }
  .pcard .jn { font-size:2.1rem; font-weight:800; line-height:1; }
  .pcard .pp { font-size:.7rem; font-weight:800; letter-spacing:.08em; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:999px; }
  .pcard .bd { padding:12px 14px; }
  .pcard .nm { font-weight:700; }
  .pcard .sub { font-size:.78rem; color:var(--muted); margin-top:2px; min-height:1em; }
  .pcard .mini { display:flex; gap:12px; margin-top:8px; font-size:.78rem; color:var(--muted); }
  .pcard .mini b { color:var(--ink); }

  /* Modal (player card and penalty card) */
  .modal { position:fixed; inset:0; background:rgba(10,20,40,.65); display:none; align-items:flex-start; justify-content:center; padding:5vh 12px; overflow-y:auto; z-index:50; }
  .modal.open { display:flex; }
  .modal-card { background:var(--card); border-radius:12px; width:100%; max-width:760px; position:relative; overflow:hidden; }
  .modal-card .close { position:absolute; top:10px; right:14px; background:none; border:0; color:#fff; font-size:1.8rem; cursor:pointer; line-height:1; }
  .mhead { background:linear-gradient(135deg,#000 0%,var(--blue) 100%); color:#fff; padding:20px; }
  .mhead .mj { font-size:.9rem; color:#a9c8ff; font-weight:700; }
  .mhead h2 { font-size:1.5rem; margin-top:2px; }
  .mtiles { display:flex; flex-wrap:wrap; gap:8px; padding:16px 20px 4px; }
  .mtile { flex:1; min-width:70px; background:var(--card-2); border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; }
  .mtile .l { font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); white-space:nowrap; }
  .mtile .v { font-size:1.3rem; font-weight:800; }
  .mlog { padding:8px 0 4px; }

  footer { background:#000; color:#8fa2c6; border-top:3px solid var(--blue); text-align:center; font-size:.75rem; padding:22px 12px 26px; margin-top:32px; }

  @media (max-width:600px) {
    main { padding:14px 12px; }
    .top { padding:12px; gap:12px; }
    .logo { height:56px; }
    .crest { width:52px; height:52px; font-size:1.1rem; }
    .brand h1 { font-size:1.4rem; }
    .brand p { font-size:.8rem; }
    td, th { padding:9px 10px; }
    .gc-hero { padding:18px 10px; gap:8px; }
    .gc-badge { width:56px; height:56px; font-size:1rem; }
    .gc-name { font-size:.9rem; }
    .gc-score { font-size:1.9rem; }
  }
.mvs{margin-top:4px;font-size:13px;font-weight:700;opacity:.85;letter-spacing:.3px}
#gc-pen table,#tbl-penalties table,table.even{table-layout:fixed;width:100%}
#gc-pen table,#tbl-penalties table{min-width:560px}
table.even{min-width:680px}
#gc-pen,#tbl-penalties,.mlog .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
#gc-pen th,#gc-pen td,#tbl-penalties th,#tbl-penalties td,table.even th,table.even td{text-align:center}
#gc-pen th:not(:only-child),#tbl-penalties th{width:20%}
table.even th{width:16.66%}
table.even th:nth-child(1){width:9%}table.even th:nth-child(2){width:14%}table.even th:nth-child(3){width:27%}table.even th:nth-child(4){width:27%}table.even th:nth-child(5){width:13%}table.even th:nth-child(6){width:10%}
/* Shutouts popup: wider Opponent and In Net columns */
table.even.so th:nth-child(1){width:8%}table.even.so th:nth-child(2){width:12%}table.even.so th:nth-child(3){width:34%}
table.even.so th:nth-child(4){width:12%}table.even.so th:nth-child(5){width:13%}table.even.so th:nth-child(6){width:21%}
</style>
</head>
<body>

<div class="ticker-wrap" id="ticker-wrap"><div class="ticker" id="ticker-scroll"><div class="ticker-inner" id="ticker"></div></div></div>

<header>
  <div class="top">
    <img id="logo" class="logo" alt="Utah Dawgs logo">
    <div class="crest" id="crest">UD</div>
    <div class="brand"><h1 id="teamName"></h1><p id="seasonLabel"></p></div>
    <div class="filter" id="filterWrap"><select id="typeFilter" title="Game type"></select></div>
  </div>
  <nav><div class="navin" id="nav"></div></nav>
</header>

<main>
  <div id="banner"></div>

  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="stats" id="stats"></div>
    <h2 class="sec">Next Up</h2>
    <div class="card"><div class="tablewrap" id="upcoming"></div></div>
    <h2 class="sec">Team Leaders</h2>
    <div class="leaders" id="leaders"></div>
    <h2 class="sec">Recent Results</h2>
    <div class="card"><div class="tablewrap" id="recent"></div></div>
  </section>

  <!-- SCHEDULE -->
  <section class="view" id="view-schedule">
    <p class="note">Tip: click any game with a listed opponent to open its Game Center.</p>
    <div class="card"><div class="tablewrap" id="tbl-schedule"></div></div>
  </section>

  <!-- GAME CENTER (not in the menu; opened from Home, the Schedule or the top cards) -->
  <section class="view" id="view-gamecenter">
    <button class="back" id="gc-back">&lsaquo; Back</button>
    <div id="gc"></div>
  </section>

  <!-- STATS (skaters, goalies, penalties) -->
  <section class="view" id="view-stats">
    <div class="jump">
      <a href="#" data-jump="sec-skaters">Skaters</a>
      <a href="#" data-jump="sec-goalies">Goalies</a>
      <a href="#" data-jump="sec-penalties">Penalties</a>
    </div>

    <div class="toolbar"><input id="search-stats" placeholder="Search players (skaters, goalies & penalties)..."></div>

    <h2 class="sec" id="sec-skaters">Skaters</h2>
    <div class="card"><div class="tablewrap" id="tbl-skaters"></div></div>
    <p class="note after key" id="sk-key"></p>

    <h2 class="sec" id="sec-goalies">Goalies</h2>
    <div class="card"><div class="tablewrap" id="tbl-goalies"></div></div>
    <p class="note after key" id="goalie-note"></p>

    <h2 class="sec" id="sec-penalties">Penalties</h2>
    <p class="note" id="pen-summary"></p>
    <div class="card"><div class="tablewrap" id="tbl-penalties"></div></div>
    <p class="note after key" id="pen-key"></p>
  </section>

  <!-- ROSTER -->
  <section class="view" id="view-roster">
    <div class="toolbar"><select id="pos-filter"></select></div>
    <div class="roster" id="roster"></div>
  </section>
</main>

<footer id="footer">Unofficial team stats site</footer>

<div class="modal" id="modal"><div class="modal-card"><button class="close" id="mclose">&times;</button><div id="mbody"></div></div></div>

<script>
/* =====================================================
   CONFIG
   ===================================================== */
const CFG = {
  teamName: "Utah Dawgs",
  crestText: "UD",
  season: "2026-27 Season",

  // Dawgs logo: the file name in your GitHub repo (same folder as index.html). Case-sensitive.
  logo: "Utah_Dawgs.png",

  // Opponent logos for the Game Center page.
  // Add one line per team:  "Team name exactly as it appears in Team Stats": "file name in your repo",
  // Teams without a line (or whose file isn't found) show their initials instead.
  teamLogos: {
    "Southern Utah Yeti":     "Southern_Utah_Yeti.png",
    "DC Wind B":              "DC_Wind.png",
    "Ogden Jr. Mustangs B":   "Ogden_Jr_Mustangs.png",
    "Vernal Raptors Black":   "Vernal_Raptors.png",
    "Park City Ice Miners B": "Park_City_Ice_Miners.png",
    "Salt Lake Lightning B":  "Salt_Lake_Lightning.png"
  },

  sheetId: "1GAJflAWGoU1IDHfo6iZNgNLCzLzDGUVUpffetXVG71g",

  // Exact tab names (case-sensitive)
  tabs: { team:"Team Stats", skaters:"Skater Stats", penalties:"Penalty Stats", goalies:"Goalie Stats", roster:"Roster" },

  // Game length in minutes, used for goals-against average (two goalies x 19.5 = 39)
  gameMinutes: 39,

  // Cards across the top of the page
  tickerPast: 4,    // previous games
  tickerNext: 12,   // upcoming games

  // Home page tables
  recentGames: 4,   // Recent Results: never shows more than this many games
  nextUpGames: 3,   // Next Up

  refreshMinutes: 5,

  // Order of the game-type filter. Types not listed here still appear, after these.
  typeOrder: ["Seeding", "Regular Season", "Tournament"]
};

/* =====================================================
   HELPERS
   ===================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Reads numbers like 4, +4, -2, (2), and "−2" (typographic minus)
const num = v => {
  const s = String(v ?? "").trim().replace(/[\u2212\u2013\u2014]/g, "-");
  const n = parseFloat(s.replace(/[^0-9.\-]/g, ""));
  if (isNaN(n)) return 0;
  return /^\(.*\)$/.test(s) ? -Math.abs(n) : n;
};
const bool = v => String(v).trim().toUpperCase() === "TRUE";
// Goalie decision: W, L, T, OTL, or "" (ND / blank = no decision).
// Reads the Decision column; also accepts Win / Loss / Tie / OT Loss / SOL, and the old W/L/T/OT checkbox columns.
const decision = r => {
  if ("Decision" in r) {
    const d = String(r.Decision || "").trim().toUpperCase().replace(/[\s.-]/g, "");
    return /^(W|WIN)$/.test(d) ? "W" : /^(L|LOSS)$/.test(d) ? "L" : /^(T|TIE)$/.test(d) ? "T"
         : /^(OTL|OTLOSS|SOL|SOLOSS)$/.test(d) ? "OTL" : "";
  }
  return bool(r.W) ? "W" : bool(r.L) ? "L" : bool(r.T) ? "T" : bool(r.OT) ? "OTL" : "";
};
// Win % counts a tie as half a win: (W + 0.5 x T) / games
const winPct = (w, t, games) => games ? Math.round(((w + 0.5 * t) / games) * 100) + "%" : "—";
const signed = n => n > 0 ? "+" + n : String(n);
const pm = n => `<span class="${n > 0 ? "pos" : n < 0 ? "neg" : ""}">${signed(n)}</span>`;
const pimFmt = v => +Number(v).toFixed(1);

const penType = v => { const n = +v; return n === 1.5 ? "Minor" : n === 4 ? "Major" : n === 8 ? "Misconduct" : ""; };
const isBench = r => /bench/i.test(r.Player || "") || /bench/i.test(r.Jersey || "") || /bench/i.test(r.Position || "");
const isGoalie = p => /^g/i.test(String(p.Position || "").trim());
const handOf = p => { const k = Object.keys(p || {}).find(k => /shoot|catch/i.test(k)); return k ? p[k] : ""; };
const isCatch = p => isGoalie(p) || /^(regular|full)/i.test(handOf(p));   // goalies: Regular / Full Right
// Roster filter groups: G = Goalies, D = Defensemen, anything else with a position = Forwards
const groupOf = p => { const s = String(p.Position || "").trim(); return !s ? "" : /^g/i.test(s) ? "Goalies" : /^d/i.test(s) ? "Defensemen" : "Forwards"; };
// "#4 • D • Shoots L" line shown under a player's name on the player card and the penalty card
const playerSub = (ro, jersey) => {
  const hand = handOf(ro || {});
  const ht = hand ? (isCatch(ro) ? hand : `Shoots ${hand}`) : "";
  return [jersey, ro?.Position, ht].filter(Boolean).map(esc).join(" &bull; ");
};

// Tournament placeholder rows: Type is Tournament AND Time and Opponent are both TBD.
// (A "T" in the Game column also counts.) Rink holds "Tournament name | City, ST".
const isTBD = v => /^\s*(tbd|tba)?\s*$/i.test(String(v ?? ""));
const isTourney = g => (/tournament/i.test(g.Type || "") && isTBD(g.Time) && isTBD(g.Opponent)) || String(g.Game || "").trim().toUpperCase() === "T";
const splitRink = r => { const s = String(r || ""); const i = s.indexOf("|"); return i < 0 ? [s.trim(), ""] : [s.slice(0, i).trim(), s.slice(i + 1).trim()]; };
const normOpp = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
const initials = s => String(s || "").split(/\s+/).filter(w => /[a-z0-9]/i.test(w)).map(w => w[0]).join("").slice(0, 3).toUpperCase();
// Logo file for an opponent, looked up in CFG.teamLogos by team name
const teamLogoFile = name => {
  const k = normOpp(name);
  for (const [n, f] of Object.entries(CFG.teamLogos)) if (normOpp(n) === k) return f;
  return "";
};

function ts(d, t) {
  const m = String(d || "").match(/(\d+)\/(\d+)\/(\d+)/);
  if (!m) return 0;
  let y = +m[3]; if (y < 100) y += 2000;
  let h = 0, mi = 0;
  const tm = String(t || "").match(/(\d+):(\d+)\s*(AM|PM)?/i);
  if (tm) { h = (+tm[1]) % 12; if ((tm[3] || "").toUpperCase() === "PM") h += 12; mi = +tm[2]; }
  return new Date(y, +m[1] - 1, +m[2], h, mi).getTime();
}
// Dates are shown without the year (Jan 15)
const longDate = d => { const t = ts(d); return t ? new Date(t).toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }) : d; };
const shortDate = d => { const t = ts(d); return t ? new Date(t).toLocaleDateString("en-US", { month:"short", day:"numeric" }) : d; };

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

async function loadTab(name) {
  const url = `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(name);
  const rows = parseCSV(await res.text()).filter(r => r.some(c => c.trim() !== ""));
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? "").trim()])));
}

/* Column glossary: heading -> [key text, hover text].
   Key text: plain meaning, shown in the line under the Stats page tables (null = leave out of the key).
   Hover text: only for columns with a formula or a rule worth explaining (null = no hover, no dotted underline). */
const GLOSS = {
  "Pos":  ["Position", null],
  "GP":   ["Games Played", null],
  "G":    ["Goals", null],
  "A":    ["Assists", null],
  "P":    ["Points", "Goals + Assists"],
  "+/-":  ["Plus/Minus", "+1 when on the ice for a goal for, −1 for a goal against"],
  "P/GP": ["Points per Game", "Points ÷ Games Played"],
  "W":    ["Wins", null],
  "L":    ["Losses", null],
  "T":    ["Ties", null],
  "OTL":  ["OT & Shootout Losses", "Overtime losses, including shootout losses"],
  "Win %":[null, "(W + ½ × T) ÷ decisions. A tie counts as half a win"],
  "GA":   ["Goals Against", null],
  "MIN":  ["Minutes Played", null],
  "GAA":  ["Goals Against Average", `Goals Against × ${CFG.gameMinutes} ÷ Minutes Played (goals allowed per full ${CFG.gameMinutes}-minute game)`],
  "SO":   ["Shutouts", "Played the full game and allowed 0 goals"],
  "PIM":  ["Penalty Minutes", null],
  "Dec.": [null, "Decision: W, L, T or OTL (— = no decision)"]
};
const abbr = label => GLOSS[label]?.[1] ? `<span class="abbr" title="${esc(GLOSS[label][1])}">${label}</span>` : label;
const keyFor = labels => labels.filter(l => GLOSS[l]?.[0]).map(l => `<b>${esc(l)}</b> ${esc(GLOSS[l][0])}`).join(" &middot; ");

/* Sortable table. cols: {k, l, n (numeric), mid (centered), f (custom cell html)}
   options: sort/asc (default sort), then (tie-break column, high to low), center (center numeric columns),
            player (rows open the player card), pen (rows open the penalty card),
            game (rows with an opponent open the Game Center), empty (message or function returning one) */
function table(el, cols, rows, o = {}) {
  let sk = o.sort || null, asc = !!o.asc, view = [];
  const rowAttr = r => {
    if (o.game && r._hasOpp) return ` class="click" data-game="${esc(r._key)}" title="Open Game Center"`;
    if (o.pen) return ` class="click" data-pen="${esc(r[o.pen])}"`;
    if (o.player && !r._bench) return ` class="click" data-player="${esc(r[o.player])}"`;
    return "";
  };
  const draw = () => {
    view = [...rows];
    const c = cols.find(c => c.k === sk);
    if (c) view.sort((a, b) => {
      let x = a[sk], y = b[sk];
      if (c.n) {
        x = (x === null || x === undefined || x === "") ? null : +x;
        y = (y === null || y === undefined || y === "") ? null : +y;
        if (x === null || y === null) return x === y ? 0 : x === null ? 1 : -1;   // blanks always sort last
      } else { x = String(x ?? "").toLowerCase(); y = String(y ?? "").toLowerCase(); }
      let r = (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1);
      if (!r && o.then) r = (+b[o.then] || 0) - (+a[o.then] || 0);
      return r;
    });
    if (!view.length) {
      const em = typeof o.empty === "function" ? o.empty() : o.empty;
      el.innerHTML = `<div class="msg">${em || "No data."}</div>`; return;
    }
    el.innerHTML = `<table${o.center ? ' class="ctr"' : ""}><thead><tr>${cols.map(c =>
      `<th data-k="${c.k}" class="${(c.n ? "num " : "") + (c.mid ? "mid" : "")}">${abbr(c.l)}<span class="arrow">${c.k === sk ? (asc ? "▲" : "▼") : ""}</span></th>`).join("")}</tr></thead>
      <tbody>${view.map(r => `<tr${rowAttr(r)}>${cols.map(c =>
        `<td class="${(c.n ? "num" : "txt") + (c.mid ? " mid" : "")}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    el.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.k, cc = cols.find(c => c.k === k);
      if (sk === k) asc = !asc; else { sk = k; asc = !cc.n; }
      draw();
    });
  };
  draw();
  return { setRows(r) { rows = r; draw(); } };
}

const renderTiles = (el, tiles) => {
  // Optional third item makes the tile clickable, e.g. ["Shutouts", 2, 'data-open="shutouts"']
  el.innerHTML = tiles.map(([a, b, attrs]) => `<div class="stat${attrs ? " click" : ""}"${attrs ? " " + attrs : ""}><div class="lbl">${a}</div><div class="val">${b}</div></div>`).join("");
};

   DATA

const D = { team:[], skaters:[], penalties:[], goalies:[], roster:[] };
let typeFilter = "", posFilter = "", PM_KEY = "Plus/Minus";
let POS = new Map();
let currentGC = null, pendingGC = null, gcReturn = "schedule";
const SK = { t:null, rows:[] }, GO = { t:null, rows:[] }, PEN = { t:null, rows:[] };

function detectColumns() {
  const k = Object.keys(D.skaters[0] || {}).find(k => /plus|\+\s*\/\s*-|±/i.test(k));
  if (k) PM_KEY = k;
}

function prepGames(rows) {
  const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  return rows.map(g => {
    // Result: W, OTW, SOW, L, OTL, SOL, T (blank = not played yet).
    // OTW/SOW count as wins and OTL/SOL as OT losses; the suffix shows (OT) or (SO).
    // Old OT / Shootout checkbox columns still work if a sheet has them.
    const r = String(g.Result || "").toUpperCase().replace(/[\s./-]/g, "");
    const so = /^SO/.test(r) || bool(g.Shootout);
    const ot = so || /^OT/.test(r) || bool(g.OT);
    const win = /^(W|WIN|OTW|SOW)$/.test(r), tie = /^(T|TIE)$/.test(r);
    let code = "";
    if (r) code = win ? "W" : tie ? "T" : ot ? "OTL" : "L";
    const suffix = !code || tie ? "" : so ? " (SO)" : ot ? " (OT)" : "";
    const tourn = isTourney(g);
    return { ...g, _ts: ts(g.Date, g.Time), _gm: num(g.Game), _code: code, _played: code !== "", _suffix: suffix,
             _tourn: tourn, _hasOpp: !tourn && !isTBD(g.Opponent), _future: ts(g.Date) >= today0.getTime(),
             _key: [g.Game, g.Date, g.Time, g.Opponent].join("~") };
  }).sort((a, b) => a._ts - b._ts || a._gm - b._gm);
}
const inType = r => !typeFilter || r.Type === typeFilter;
// Upcoming = no result recorded (tournament placeholders only count while their date hasn't passed)
const upcomingGames = () => D.team.filter(g => !g._played && (!g._tourn || g._future));
const badge = g => g._played ? `<span class="badge ${g._code}">${g._code}${g._code === "W" ? esc(g._suffix) : ""}</span>` : "—";
const vs = g => {
  const away = String(g["Home/Away"]).toLowerCase().startsWith("a");
  return (away ? "@ " : g._tourn ? "" : "vs ") + esc(g.Opponent);
};

/* ----- Aggregations (every tab is summed per player) ----- */
function skaterAgg(rows) {
  const m = new Map();
  rows.forEach(r => {
    const n = r.Player; if (!n) return;
    let a = m.get(n); if (!a) { a = { Player:n, Jersey:r.Jersey, GP:0, G:0, A:0, P:0, PM:0 }; m.set(n, a); }
    a.GP++; a.G += num(r.G); a.A += num(r.A);
    a.P += r.P !== "" ? num(r.P) : num(r.G) + num(r.A);
    a.PM += num(r[PM_KEY]);
    a.Jersey = r.Jersey || a.Jersey;
  });
  return [...m.values()].map(a => ({ ...a, JN: num(a.Jersey), PPG: a.GP ? +(a.P / a.GP).toFixed(2) : 0 }));
}
const skRows = rows => skaterAgg(rows).map(r => ({ ...r, Pos: POS.get(r.Player) || "" }));

function goalieAgg(rows) {
  const m = new Map();
  rows.forEach(r => {
    const n = r.Goalie; if (!n) return;
    let a = m.get(n); if (!a) { a = { Player:n, Jersey:r.Jersey, GP:0, W:0, L:0, T:0, OTL:0, GA:0, MIN:0, SO:0 }; m.set(n, a); }
    a.GP++; const dc = decision(r); if (dc) a[dc]++;
    a.GA += num(r.GA); a.MIN += num(r.Minutes);
    // Shutout only for a goalie who played the whole game and allowed 0 (split-game zeros are team shutouts)
    if (num(r.Minutes) >= CFG.gameMinutes && r.GA !== "" && num(r.GA) === 0) a.SO++;
    a.Jersey = r.Jersey || a.Jersey;
  });
  return [...m.values()].map(a => ({ ...a, JN: num(a.Jersey), GAA: a.MIN > 0 ? +(a.GA * CFG.gameMinutes / a.MIN).toFixed(2) : null, MIN: +a.MIN.toFixed(1),
    DEC: a.W + a.L + a.T + a.OTL, WPCT: (a.W + a.L + a.T + a.OTL) ? (a.W + 0.5 * a.T) / (a.W + a.L + a.T + a.OTL) : null }));
}

function penaltyAgg(rows) {
  const m = new Map();
  rows.forEach(r => {
    const bench = isBench(r);
    const n = bench ? "Bench" : (r.Player || "Unknown");
    let a = m.get(n); if (!a) { a = { Player:n, Jersey: bench ? "" : r.Jersey, _bench:bench, PEN:0, PIM:0, types:new Map() }; m.set(n, a); }
    a.PEN++; a.PIM += num(r.PIM);
    a.types.set(r.Penalty, (a.types.get(r.Penalty) || 0) + 1);
  });
  return [...m.values()].map(a => ({ ...a, JN: a._bench ? null : num(a.Jersey), PIM: pimFmt(a.PIM), Common: [...a.types.entries()].sort((x, y) => y[1] - x[1])[0]?.[0] || "" }));
}

// Hide the right-edge fade when there's nothing more to scroll to
function tickerFade() {
  const t = $("ticker-scroll");
  $("ticker-wrap").classList.toggle("at-end", t.scrollLeft + t.clientWidth >= t.scrollWidth - 4);
}
function renderTicker() {
  const played = D.team.filter(g => g._played).slice(-CFG.tickerPast);
  const upcoming = upcomingGames().slice(0, CFG.tickerNext);
  const linkAttrs = g => g._hasOpp ? ` link" data-game="${esc(g._key)}" title="Open Game Center` : "";
  const gcBar = g => g._hasOpp ? `<div class="gc">Game Center &rsaquo;</div>` : "";

  const res = played.map(g => `<div class="tgame${linkAttrs(g)}">
      <div class="tdate">${esc(shortDate(g.Date))} &bull; Final${esc(g._suffix)}</div>
      <div class="trow"><span>${esc(CFG.teamName)}</span><span>${esc(g.GF)}</span></div>
      <div class="trow dim"><span>${vs(g)}</span><span>${esc(g.GA)}</span></div>
      <div class="tres ${g._code}">${g._code === "W" ? "WIN" : g._code === "L" ? "LOSS" : g._code}</div>${gcBar(g)}</div>`).join("");

  const up = upcoming.map((g, i) => {
    const first = i === 0 ? " next" : "";
    if (g._tourn) {
      // Tournament card: date / tournament name (left of |) / location (right of |)
      const [name, loc] = splitRink(g.Rink);
      return `<div class="tgame upcoming${first}"><div class="tdate">${esc(shortDate(g.Date))}</div>
        <div class="up-line">${esc(name || "Tournament")}</div>
        <div class="trow dim"><span>${esc(loc) || "&nbsp;"}</span></div>
        <div class="tres up">UPCOMING</div></div>`;
    }
    const when = esc(shortDate(g.Date)) + (g.Time ? ` &bull; ${esc(g.Time)}` : "");
    return `<div class="tgame upcoming${first}${linkAttrs(g)}"><div class="tdate">${when}</div>
      <div class="up-line">${esc(CFG.teamName)}</div>
      <div class="trow dim"><span>${vs(g)}</span></div>
      <div class="tres up">UPCOMING</div>${gcBar(g)}</div>`;
  }).join("");

  $("ticker").innerHTML = res + up || `<div class="tgame"><div class="tdate">No games</div></div>`;
  // No auto-scroll: the bar opens at the far left (oldest of the recent games) and keeps its position on refresh
  tickerFade();
}

/* Leader card: ties share a rank (T-1, T-1, T-1, then 4), ties ordered by jersey number */
function leaderCard(title, rows, key, o = {}) {
  const fmt = o.fmt || (v => v);
  const pool = rows.filter(o.filter || (() => true));
  const dir = o.asc ? 1 : -1;
  pool.sort((a, b) => dir * (a[key] - b[key]) || num(a.Jersey) - num(b.Jersey));
  const ranked = pool.map(p => ({
    p,
    rank: pool.filter(q => o.asc ? q[key] < p[key] : q[key] > p[key]).length + 1,
    tied: pool.filter(q => q[key] === p[key]).length > 1
  })).filter(x => x.rank <= 5);
  return `<div class="card leader"><h3>${title}</h3>${ranked.length ? ranked.map(x =>
    `<div class="lrow${x.rank === 1 ? " first" : ""}" data-player="${esc(x.p.Player)}"><span class="rank">${x.tied ? "T-" : ""}${x.rank}</span><span class="name">${esc(x.p.Player)}</span><span class="num">${fmt(x.p[key])}</span></div>`).join("")
    : `<div class="msg">No data</div>`}</div>`;
}

function renderHome() {
  const games = D.team.filter(inType), done = games.filter(g => g._played);
  const w = done.filter(g => g._code === "W").length, l = done.filter(g => g._code === "L").length;
  const t = done.filter(g => g._code === "T").length, otl = done.filter(g => g._code === "OTL").length;
  const gf = done.reduce((s, g) => s + num(g.GF), 0), ga = done.reduce((s, g) => s + num(g.GA), 0), gp = done.length;
  // Team PIM = every row in Penalty Stats, including bench minors
  const pims = D.penalties.filter(inType).reduce((s, r) => s + num(r.PIM), 0);
  renderTiles($("stats"), [
    ["Record (W-L-T-OTL)", `${w}-${l}-${t}-${otl}`], ["Games Played", gp],
    ["Win %", winPct(w, t, gp)],
    ["Goals For", gf], ["Goals Against", ga], ["Goal Diff", signed(gf - ga)],
    ["GF / Game", gp ? (gf / gp).toFixed(2) : "—"], ["GA / Game", gp ? (ga / gp).toFixed(2) : "—"],
    ["Shutouts", done.filter(isShutout).length, 'data-open="shutouts" title="See shutout games"'],
    ["Penalty Min", pimFmt(pims)]
  ]);

  // Next Up and Recent Results always show the actual next / last games; rows with an opponent open the Game Center
  table($("upcoming"), [
    { k:"Date", l:"Date", mid:true, f:g => esc(shortDate(g.Date)) }, { k:"Time", l:"Time", mid:true },
    { k:"Opponent", l:"Opponent", f:g => vs(g) }, { k:"Rink", l:"Rink" }, { k:"Type", l:"Type" }
  ], upcomingGames().slice(0, CFG.nextUpGames), { game:true, empty:"No upcoming games scheduled." });

  const sk = skaterAgg(D.skaters.filter(inType)), go = goalieAgg(D.goalies.filter(inType));
  $("leaders").innerHTML =
    leaderCard("Points", sk, "P", { filter:p => p.P > 0 }) +
    leaderCard("Goals", sk, "G", { filter:p => p.G > 0 }) +
    leaderCard("Assists", sk, "A", { filter:p => p.A > 0 }) +
    leaderCard("Points / Game", sk, "PPG", { filter:p => p.P > 0, fmt:v => v.toFixed(2) }) +
    leaderCard("Plus / Minus", sk, "PM", { fmt:signed }) +
    leaderCard("Goalie Wins", go, "W", { filter:g => g.W > 0 }) +
    leaderCard("Goals Against Avg", go, "GAA", { asc:true, filter:g => g.GAA !== null && g.MIN > 0, fmt:v => v.toFixed(2) });

  // Most recent first, and never more than CFG.recentGames rows
  const recent = D.team.filter(g => g._played).slice(-CFG.recentGames).reverse().slice(0, CFG.recentGames);
  table($("recent"), scheduleCols(), recent, { game:true, empty:"No games played." });
}

function renderSkaters() {

  // Default sort: points per game (ties broken by total points)
  SK.t = table($("tbl-skaters"), skaterCols(), SK.rows.filter(hit), { sort:"PPG", then:"P", player:"Player", center:true, empty:searchEmpty("No data.") });
  $("sk-key").innerHTML = keyFor(skaterCols().map(c => c.l));
}

function renderGoalies() {
  GO.rows = goalieAgg(D.goalies.filter(inType));
  // Default sort: goals against average, lowest first (ties broken by wins)
  GO.t = table($("tbl-goalies"), goalieCols(), GO.rows.filter(hit), { sort:"GAA", asc:true, then:"W", player:"Player", center:true, empty:searchEmpty("No data.") });
  $("goalie-note").innerHTML = keyFor(goalieCols().map(c => c.l));
}

function renderPenalties() {
  const raw = D.penalties.filter(inType);
  PEN.rows = penaltyAgg(raw);
  const total = raw.reduce((s, r) => s + num(r.PIM), 0);
  const bench = raw.filter(isBench);
  const benchPIM = bench.reduce((s, r) => s + num(r.PIM), 0);
  $("pen-summary").textContent = raw.length
    ? `Team total: ${raw.length} penalties, ${pimFmt(total)} PIM (includes ${bench.length} bench ${bench.length === 1 ? "penalty" : "penalties"}, ${pimFmt(benchPIM)} PIM).`
    : "";
  // Clicking a row opens the penalty card (all of that player's penalties)
  PEN.t = table($("tbl-penalties"), penaltyCols(), PEN.rows.filter(hit), { sort:"PIM", pen:"Player", center:true, empty:searchEmpty("No penalties recorded.") });
  $("pen-key").innerHTML = keyFor(penaltyCols().map(c => c.l)) + " &middot; Minor 1.5 &middot; Major 4 &middot; Misconduct 8";
}

/* ----- Game Center -----
   Head-to-Head and Previous Meetings always cover every game against this opponent.
   Upcoming game: the skater, goalie and penalty tables also cover every game against the opponent.
   Finished game: the skater, goalie and penalty tables cover only that one game.
   (Ignores the game-type filter.) */
function renderGameCenter() {
  const g = D.team.find(x => x._key === currentGC);
  if (!g) { currentGC = null; showView("schedule"); return; }
  const opp = g.Opponent, nk = normOpp(opp), sameOpp = r => normOpp(r.Opponent) === nk;
  const meet = D.team.filter(x => x._played && sameOpp(x)).sort((a, b) => b._ts - a._ts);
  const cnt = c => meet.filter(x => x._code === c).length;
  const gp = meet.length, won = cnt("W");
  const gf = meet.reduce((s, x) => s + num(x.GF), 0), ga = meet.reduce((s, x) => s + num(x.GA), 0);

  // Which player rows feed the tables below
  const thisGame = r => sameOpp(r) && String(r.Game).trim() === String(g.Game).trim();
  const scope = g._played ? thisGame : sameOpp;
  const skIn = D.skaters.filter(scope), goIn = D.goalies.filter(scope), penRows = D.penalties.filter(scope);
  const pimAll = D.penalties.filter(sameOpp).reduce((s, r) => s + num(r.PIM), 0);   // Head-to-Head tile: all games
  const pimScope = penRows.reduce((s, r) => s + num(r.PIM), 0);
  const tag = g._played ? "This Game" : `vs ${esc(opp)}`;
  const noneFor = what => g._played ? `No ${what} recorded for this game.` : `No ${what} against ${esc(opp)}.`;

  const when = esc(longDate(g.Date)) + (!isTBD(g.Time) ? ` &bull; ${esc(g.Time)}` : "");
  const where = [g.Game && !/^t$/i.test(String(g.Game).trim()) ? "Game " + g.Game : "", g.Rink, g["Home/Away"]].filter(Boolean).map(esc).join(" &bull; ");
  const center = g._played
    ? `<div class="gc-status">FINAL${esc(g._suffix)}</div><div class="gc-score">${esc(g.GF)} – ${esc(g.GA)}</div>
       <div class="gc-meta">${when}<br>${where}</div><div style="margin-top:8px">${badge(g)}</div>`
    : `<div class="gc-status">UPCOMING</div><div class="gc-score">VS</div><div class="gc-meta">${when}<br>${where}</div>`;

  // Opponent badge: their logo file from CFG.teamLogos, or their initials if there's no file
  const oppInit = esc(initials(opp)), oppFile = teamLogoFile(opp);
  const oppBadge = oppFile ? `<img src="${esc(oppFile)}" alt="" onerror="this.parentNode.textContent='${oppInit}'">` : oppInit;

  $("gc").innerHTML = `
    <div class="gc-hero">
      <div class="gc-team"><div class="gc-badge"><img src="${esc(CFG.logo)}" alt="" onerror="this.parentNode.textContent='${esc(CFG.crestText)}'"></div><div class="gc-name">${esc(CFG.teamName)}</div></div>
      <div class="gc-mid">${center}</div>
      <div class="gc-team"><div class="gc-badge">${oppBadge}</div><div class="gc-name">${esc(opp)}</div></div>
    </div>
    <h2 class="sec">Head-to-Head vs ${esc(opp)}</h2>
    <div class="stats" id="gc-stats"></div>
    <h2 class="sec">${g._played ? "All Meetings" : "Previous Meetings"}</h2>
    <div class="card"><div class="tablewrap" id="gc-meet"></div></div>
    <h2 class="sec">Skaters ${tag}</h2>
    <div class="card"><div class="tablewrap" id="gc-sk"></div></div>
    <h2 class="sec">Goalies ${tag}</h2>
    <div class="card"><div class="tablewrap" id="gc-go"></div></div>
    <h2 class="sec">Penalties ${tag}</h2>
    <p class="note">${penRows.length ? `${penRows.length} ${penRows.length === 1 ? "penalty" : "penalties"}, ${pimFmt(pimScope)} PIM ${g._played ? "in this game" : `against ${esc(opp)}`} (includes bench minors).` : ""}</p>
    <div class="card"><div class="tablewrap" id="gc-pen"></div></div>`;

  renderTiles($("gc-stats"), [
    ["Games Played", gp],
    ["Record (W-L-T-OTL)", `${won}-${cnt("L")}-${cnt("T")}-${cnt("OTL")}`],
    ["Win %", winPct(won, cnt("T"), gp)],
    ["Goals For", gf], ["Goals Against", ga], ["Goal Diff", signed(gf - ga)],
    ["Penalty Min", pimFmt(pimAll)]
  ]);
  table($("gc-meet"), [
    { k:"_gm", l:"Game", n:true, mid:true, f:x => esc(x.Game) },
    { k:"_ts", l:"Date", n:true, mid:true, f:x => esc(shortDate(x.Date)) },
    { k:"Home/Away", l:"Home/Away", mid:true },
    { k:"Rink", l:"Rink" },
    { k:"GF", l:"Score", n:true, mid:true, f:x => `${esc(x.GF)} – ${esc(x.GA)}` },
    { k:"_code", l:"Result", mid:true, f:x => badge(x) },
    { k:"Type", l:"Type" }
  ], meet, { sort:"_ts", empty:`No previous games against ${esc(opp)}.` });
  table($("gc-sk"), skaterCols(), skRows(skIn),
    { sort:"PPG", then:"P", player:"Player", center:true, empty:noneFor("skater stats") });
  table($("gc-go"), goalieCols(), goalieAgg(goIn),
    { sort:"GAA", asc:true, then:"W", player:"Player", center:true, empty:noneFor("goalie stats") });
  if (g._played) {
    // Box-score style: one row per penalty
    const list = penRows.map(r => { const b = isBench(r); return { Player: b ? "Bench" : (r.Player || "Unknown"), Jersey: b ? "" : r.Jersey, JN: b ? null : num(r.Jersey), _bench: b, Penalty: r.Penalty, Type: penType(num(r.PIM)), PIM: num(r.PIM) }; });
    table($("gc-pen"), [
      { k:"Player", l:"Player", mid:true },
      { k:"JN", l:"Jersey", n:true, mid:true, f:r => esc(r.Jersey) },
      { k:"Penalty", l:"Penalty", mid:true },
      { k:"Type", l:"Type", mid:true, f:r => esc(r.Type) },
      { k:"PIM", l:"PIM", n:true, mid:true, f:r => pimFmt(r.PIM) }
    ], list, { pen:"Player", center:true, empty:noneFor("penalties") });
  } else {
    table($("gc-pen"), penaltyCols(), penaltyAgg(penRows),
      { sort:"PIM", pen:"Player", center:true, empty:noneFor("penalties") });
  }
}

function openGameCenter(key) {
  // Remember which page we came from so "Back" returns there (Home or Schedule)
  const from = document.querySelector(".view.active")?.id.replace("view-", "");
  if (from && from !== "gamecenter") gcReturn = from;
  currentGC = key;
  renderGameCenter();
  if (currentGC) showView("gamecenter", "#gc/" + encodeURIComponent(key));
}

function renderRoster() {
  const players = D.roster.filter(p => !isBench(p));
  const groups = ["Forwards", "Defensemen", "Goalies"].filter(g => players.some(p => groupOf(p) === g));
  const sel = $("pos-filter");
  if (posFilter && !groups.includes(posFilter)) posFilter = "";
  sel.innerHTML = `<option value="">All players</option>` + groups.map(x => `<option value="${x}"${x === posFilter ? " selected" : ""}>${x}</option>`).join("");
  sel.style.display = groups.length > 1 ? "" : "none";

  // Roster stats are full-season totals (the game-type filter is hidden on this page)
  const sk = new Map(skaterAgg(D.skaters).map(a => [a.Player, a]));
  const go = new Map(goalieAgg(D.goalies).map(a => [a.Player, a]));
  const rows = players.filter(p => !posFilter || groupOf(p) === posFilter).sort((a, b) => num(a.Jersey) - num(b.Jersey));
  $("roster").innerHTML = rows.length ? rows.map(p => {
    const s = sk.get(p.Player), g = go.get(p.Player);
    const mini = s ? `<span>GP <b>${s.GP}</b></span><span>G <b>${s.G}</b></span><span>A <b>${s.A}</b></span><span>P <b>${s.P}</b></span>`
               : g ? `<span>GP <b>${g.GP}</b></span><span>W <b>${g.W}</b></span><span>GAA <b>${g.GAA === null ? "—" : g.GAA.toFixed(2)}</b></span>` : "";
    const hand = handOf(p);
    // Goalies show just the catch value (Regular / Full Right); skaters show "Shoots L/R"
    const handLine = hand ? (isCatch(p) ? esc(hand) : `Shoots ${esc(hand)}`) : "&nbsp;";
    return `<div class="pcard" data-player="${esc(p.Player)}">
      <div class="hd"><div class="jn">${esc(p.Jersey || "#")}</div>${p.Position ? `<div class="pp">${esc(p.Position)}</div>` : ""}</div>
      <div class="bd"><div class="nm">${esc(p.Player)}</div><div class="sub">${handLine}</div><div class="mini">${mini}</div></div></div>`;
  }).join("") : `<div class="msg">Roster not available.</div>`;
}

/* ----- Player card and penalty card (shown in the pop-up) ----- */
// mid: column indexes to center, e.g. [3]
function miniTable(headers, rows, even, mid = []) {
  const cls = i => mid.includes(i) ? ' class="mid"' : "";
  return `<div class="tablewrap"><table${even ? ' class="even"' : ""}><thead><tr>${headers.map((h, i) => `<th${cls(i)} style="cursor:default">${abbr(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${cls(i)}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const mtile = (l, v) => `<div class="mtile"><div class="l">${abbr(l)}</div><div class="v">${v}</div></div>`;

function openPlayer(name, opp) {
  const vs = r => !opp || normOpp(r.Opponent) === normOpp(opp);
  const ro = D.roster.find(r => r.Player === name);
  const srows = D.skaters.filter(r => r.Player === name && vs(r)).sort((a, b) => ts(a.Date) - ts(b.Date));
  const grows = D.goalies.filter(r => r.Goalie === name && vs(r)).sort((a, b) => ts(a.Date) - ts(b.Date));
  const jersey = ro?.Jersey || srows[0]?.Jersey || grows[0]?.Jersey || "";
  let tiles = "", log = "";
  if (srows.length) {
    const a = skaterAgg(srows)[0];
    tiles = mtile("GP", a.GP) + mtile("G", a.G) + mtile("A", a.A) + mtile("P", a.P) + mtile("+/-", signed(a.PM)) + mtile("P/GP", a.PPG.toFixed(2));
    log = miniTable(["Gm", "Date", "Opponent", "G", "A", "P", "+/-"],
      srows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), esc(r.G), esc(r.A), esc(r.P), pm(num(r[PM_KEY]))]));
  } else if (grows.length) {
    const a = goalieAgg(grows)[0];
    tiles = mtile("GP", a.GP) + mtile("Record", `${a.W}-${a.L}-${a.T}-${a.OTL}`) +
      mtile("Win %", a.WPCT === null ? "—" : Math.round(a.WPCT * 100) + "%") + mtile("GA", a.GA) + mtile("GAA", a.GAA === null ? "—" : a.GAA.toFixed(2)) + mtile("SO", a.SO);
    log = miniTable(["Gm", "Date", "Opponent", "Dec.", "GA", "MIN"],
      grows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), decision(r) || "—", esc(r.GA), esc(r.Minutes)]), false, [3]);
  } else tiles = `<div class="msg" style="width:100%">No game stats${opp ? " against " + esc(opp) : ""}.</div>`;
  const pens = D.penalties.filter(r => r.Player === name && vs(r));
  const penLine = pens.length ? `<p class="note" style="padding:8px 20px 0">Penalties: ${pens.length} for ${pimFmt(pens.reduce((s, r) => s + num(r.PIM), 0))} PIM</p>` : "";
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${playerSub(ro, jersey)}</div><h2>${esc(name)}</h2>${opp ? `<div class="mvs">vs ${esc(opp)}</div>` : ""}</div>
    <div class="mtiles">${tiles}</div>${penLine}<div class="mlog">${log}</div>`;
  $("modal").classList.add("open");
}

// Penalty card: same header as the player card, but only penalty info (and every penalty listed)
function openPenaltyCard(name, opp) {
  const bench = name === "Bench";
  const rows = D.penalties
    .filter(r => !opp || normOpp(r.Opponent) === normOpp(opp))
    .filter(r => bench ? isBench(r) : (!isBench(r) && (r.Player || "Unknown") === name))
    .sort((a, b) => ts(a.Date) - ts(b.Date) || num(a.Game) - num(b.Game));
  const ro = bench ? null : D.roster.find(r => r.Player === name);
  const jersey = bench ? "" : (ro?.Jersey || rows[0]?.Jersey || "");
  const sub = bench ? "Bench minors" : playerSub(ro, jersey);
  const total = rows.reduce((s, r) => s + num(r.PIM), 0);
  const games = new Set(rows.map(r => r.Game)).size;
  const counts = new Map(); rows.forEach(r => counts.set(r.Penalty, (counts.get(r.Penalty) || 0) + 1));
  const common = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
  const tiles = mtile("Penalties", rows.length) + mtile("PIM", pimFmt(total)) + mtile("Games", games) + mtile("PIM / Game", games ? pimFmt(total / games) : "—");
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${sub}</div><h2>${esc(name)}</h2>${opp ? `<div class="mvs">vs ${esc(opp)}</div>` : ""}</div>
    <div class="mtiles">${tiles}</div>
    ${common ? `<p class="note" style="padding:8px 20px 0">Most common: ${esc(common[0])} (${common[1]})</p>` : ""}
    <div class="mlog">${rows.length
      ? miniTable(["Gm", "Date", "Opponent", "Penalty", "Type", "PIM"],
          rows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), esc(r.Penalty), esc(penType(num(r.PIM))), esc(r.PIM)]), true)
      : `<div class="msg">No penalties recorded${opp ? " against " + esc(opp) : ""}.</div>`}</div>`;
  $("modal").classList.add("open");
}
// Team shutout: a played game with 0 goals against
const isShutout = g => g._played && g.GA !== "" && num(g.GA) === 0;

// Shutouts popup (Home page tile), same layout as the penalty card: tiles, then a game list with who was in net
function openShutouts() {
  const all = D.team.filter(inType).filter(g => g._played), games = all.filter(isShutout);   // oldest first, like the player cards
  const inNet = g => D.goalies
    .filter(r => String(r.Game).trim() === String(g.Game).trim() && normOpp(r.Opponent) === normOpp(g.Opponent))
    .map(r => esc(String(r.Goalie).trim().split(/\s+/).pop())).join("<br>") || "—";   // last names keep the popup narrow
  const gfTotal = games.reduce((s, g) => s + num(g.GF), 0);
  const tiles = mtile("Shutouts", games.length) + mtile("Games Played", all.length) +
    mtile("Shutout %", all.length ? Math.round(games.length / all.length * 100) + "%" : "—") +
    mtile("GF / Game", games.length ? (gfTotal / games.length).toFixed(2) : "—");
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${esc(typeFilter || "All games")} &bull; ${esc(CFG.season)}</div><h2>Team Shutouts</h2></div>
    <div class="mtiles">${tiles}</div>
    <div class="mlog">${games.length
      ? miniTable(["Gm", "Date", "Opponent", "Score", "Result", "In Net"],
          games.map(g => [esc(g.Game), esc(shortDate(g.Date)), vs(g), `${esc(g.GF)} – ${esc(g.GA)}`, badge(g), inNet(g)]), true).replace('class="even"', 'class="even so"')
      : `<div class="msg">No shutouts yet.</div>`}</div>`;
  $("modal").classList.add("open");
}
const closeModal = () => $("modal").classList.remove("open");

/* =====================================================
   NAV / INIT
   ===================================================== */
function showView(id, hash) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + id));
  const navId = id === "gamecenter" ? gcReturn : id;    // Game Center keeps the page you came from highlighted
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.v === navId));
  $("filterWrap").style.display = (id === "roster" || id === "gamecenter") ? "none" : "";   // game-type filter hidden on Roster / Game Center
  history.replaceState(null, "", hash || "#" + id);
  window.scrollTo(0, 0);
}

function buildNav() {
  const items = [["home","Home"],["schedule","Schedule"],["stats","Stats"],["roster","Roster"]];
  $("nav").innerHTML = items.map(([id, l]) => `<button data-v="${id}">${l}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { currentGC = null; showView(b.dataset.v); });
  const h = location.hash;
  if (h.startsWith("#gc/")) {                              // a shared Game Center link: open it once the data has loaded
    try { pendingGC = decodeURIComponent(h.slice(4)); } catch (e) {}
    gcReturn = "schedule";
    showView("schedule");
  } else {
    const start = h.slice(1);
    showView(items.some(i => i[0] === start) ? start : "home");
  }
}

function renderAll() {
  POS = new Map(D.roster.filter(p => !isBench(p)).map(p => [p.Player, p.Position || ""]));
  renderTicker(); renderHome(); renderSchedule(); renderSkaters(); renderGoalies(); renderPenalties(); renderRoster();
  if (currentGC) renderGameCenter();
}

function buildTypeFilter() {
  const rank = t => { const i = CFG.typeOrder.findIndex(x => normOpp(x) === normOpp(t)); return i < 0 ? CFG.typeOrder.length : i; };
  const types = [...new Set(D.team.map(g => g.Type).filter(Boolean))].map((t, i) => [t, i])
    .sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);   // listed order first, then sheet order
  const sel = $("typeFilter");
  sel.innerHTML = `<option value="">All games</option>` + types.map(t => `<option value="${esc(t)}"${t === typeFilter ? " selected" : ""}>${esc(t)}</option>`).join("");
  sel.style.display = types.length > 1 ? "" : "none";
}

async function loadAll() {
  const keys = Object.keys(CFG.tabs);
  const results = await Promise.allSettled(keys.map(k => loadTab(CFG.tabs[k])));
  const failed = [];
  results.forEach((r, i) => { if (r.status === "fulfilled") D[keys[i]] = r.value; else failed.push(CFG.tabs[keys[i]]); });
  D.team = prepGames(D.team);
  detectColumns();
  $("banner").innerHTML = failed.length
    ? `<div class="card" style="margin-bottom:14px"><div class="msg err">Couldn't load: ${failed.map(esc).join(", ")}. Check the tab names and that the sheet is shared as "Anyone with the link can view".</div></div>` : "";
  buildTypeFilter();
  renderAll();
  if (pendingGC) {
    const k = pendingGC; pendingGC = null;
    if (D.team.some(g => g._key === k)) openGameCenter(k);
  }
  $("footer").textContent = `Unofficial team stats site • Updated ${new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })}`;
}

/* Logo (falls back to the "UD" circle if the image isn't found) + favicon */
const logoEl = $("logo");
logoEl.onerror = () => { logoEl.style.display = "none"; $("crest").style.display = "grid"; };
logoEl.src = CFG.logo;
const fav = document.createElement("link"); fav.rel = "icon"; fav.href = CFG.logo; document.head.appendChild(fav);

$("teamName").textContent = CFG.teamName;
$("crest").textContent = CFG.crestText;
$("seasonLabel").textContent = CFG.season;
$("typeFilter").onchange = e => { typeFilter = e.target.value; renderAll(); };
$("pos-filter").onchange = e => { posFilter = e.target.value; renderRoster(); };
$("search-stats").oninput = applySearch;
$("gc-back").onclick = () => { currentGC = null; showView(gcReturn); };
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); $(j.dataset.jump).scrollIntoView({ behavior:"smooth", block:"start" }); return; }
  const gm = e.target.closest("[data-game]");
  if (gm && gm.dataset.game) { closeModal(); openGameCenter(gm.dataset.game); return; }
  const op = e.target.closest("[data-open]");
  if (op && op.dataset.open === "shutouts") { openShutouts(); return; }
  // Cards opened from inside the Game Center only show that opponent
  const inGC = e.target.closest("#view-gamecenter");
  const gcOpp = inGC ? D.team.find(x => x._key === currentGC)?.Opponent : null;
  const pn = e.target.closest("[data-pen]");
  if (pn && pn.dataset.pen) { openPenaltyCard(pn.dataset.pen, gcOpp); return; }
  const p = e.target.closest("[data-player]");
  if (p && p.dataset.player) openPlayer(p.dataset.player, gcOpp);
});
$("ticker-scroll").addEventListener("scroll", tickerFade, { passive:true });
window.addEventListener("resize", tickerFade);
$("mclose").onclick = closeModal;
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

buildNav();
loadAll();
setInterval(loadAll, CFG.refreshMinutes * 60000);
</script>
</body>
