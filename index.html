    ["Penalty Kill %" + (st.est ? " (est.)" : ""), st.pkPct], ["Power-Play Goals Against / Times Shorthanded", `${st.ppga} / ${st.pko}`],
    ["Shorthanded Goals", st.shg], ["Shorthanded Goals Against", st.shga]);
  if (sfG.length) tiles.push(["Shots / Game", (sf / sfG.length).toFixed(1)], ["Shooting %", pct(gfS, sf)]);
  if (saG.length) tiles.push(["Shots Against / Game", (sa / saG.length).toFixed(1)], ["Team Save %", svFmt(sa ? (sa - gaS) / sa : null)]);
  if (tiles.length) renderTiles($("sp-tiles"), tiles);
  else $("sp-tiles").innerHTML = `<div class="card" style="grid-column:1/-1"><div class="msg">No power-play or shot data entered yet.</div></div>`;
  $("sp-note").innerHTML = (st.est ? "Penalty Kill % is estimated for games without PKO (each Dawgs minor or major counts as a time shorthanded)." : "") +
    of(ppG.length, "Power-play stats") + of(sfG.length, "Shot stats");

  // Goals by period
  const perG = done.filter(g => g._per), n = perG.length;
  const otGames = perG.filter(g => g._per.f[3] || g._per.a[3] || /OT|SO/.test(g._suffix));
  const prow = (label, i, gs) => {
    const f = sum(gs, g => g._per.f[i]), a = sum(gs, g => g._per.a[i]);
    return { P:label, GF:f, GA:a, DIFF:f - a, GFPG: gs.length ? f / gs.length : null, GAPG: gs.length ? a / gs.length : null };
  };
  const prows = n ? [prow("1st Period", 0, perG), prow("2nd Period", 1, perG), prow("3rd Period", 2, perG)] : [];
  if (otGames.length) prows.push(prow("Overtime", 3, otGames));
  table($("sp-period"), [
    { k:"P", l:"Period" }, { k:"GF", l:"GF", n:true }, { k:"GA", l:"GA", n:true }, { k:"DIFF", l:"Diff", n:true, f:r => pm(r.DIFF) },
    { k:"GFPG", l:"GF/GP", n:true, f:r => r.GFPG === null ? "—" : r.GFPG.toFixed(2) }, { k:"GAPG", l:"GA/GP", n:true, f:r => r.GAPG === null ? "—" : r.GAPG.toFixed(2) }
  ], prows, { center:true, empty:"No period scores entered yet." });
  $("sp-period-note").textContent = n ? `GF/GP and GA/GP = goals in that period per game${otGames.length ? " (overtime: per game that went to overtime)" : ""}.` + of(n, "Period stats") : "";

  // Wins vs losses: what's different in the games we win
  const resName = { W:"Wins", L:"Losses", T:"Ties", OTL:"OT / SO losses" };
  const cmp = Object.entries(resName).map(([c, label]) => {
    const gs = done.filter(g => g._code === c); if (!gs.length) return null;
    const per = (list, f) => list.length ? sum(list, f) / list.length : null;
    const sfL = gs.filter(g => g._sf !== null), saL = gs.filter(g => g._sa !== null), ppL = gs.filter(g => g._pp), t = specialTeams(ppL);
    return { R:label, GP:gs.length, GFPG:per(gs, g => num(g.GF)), GAPG:per(gs, g => num(g.GA)), SFPG:per(sfL, g => g._sf), SAPG:per(saL, g => g._sa),
             PIMPG:per(gs, gamePIM), PP:ppL.length && t.ppo ? t.ppg / t.ppo : null, PK:ppL.length && t.pko ? 1 - t.ppga / t.pko : null };
  }).filter(Boolean);
  const f2 = v => v === null ? "—" : v.toFixed(2), f1 = v => v === null ? "—" : v.toFixed(1), fp = v => v === null ? "—" : Math.round(v * 100) + "%";
  const cmpCols = [
    { k:"R", l:"Result" }, { k:"GP", l:"GP", n:true },
    { k:"GFPG", l:"GF/GP", n:true, f:r => f2(r.GFPG) }, { k:"GAPG", l:"GA/GP", n:true, f:r => f2(r.GAPG) },
    ...(sfG.length ? [{ k:"SFPG", l:"SF/GP", n:true, f:r => f1(r.SFPG) }] : []), ...(saG.length ? [{ k:"SAPG", l:"SA/GP", n:true, f:r => f1(r.SAPG) }] : []),
    { k:"PIMPG", l:"PIM/GP", n:true, f:r => f2(r.PIMPG) },
    ...(ppG.length ? [{ k:"PP", l:"PP%", n:true, f:r => fp(r.PP) }, { k:"PK", l:"PK%", n:true, f:r => fp(r.PK) }] : [])
  ];

  // Record splits
  const lead = (g, k) => { if (!g._per) return null; const d = g._per.f.slice(0, k).reduce((s, x) => s + x, 0) - g._per.a.slice(0, k).reduce((s, x) => s + x, 0);
    return d > 0 ? "Leading" : d < 0 ? "Trailing" : "Tied"; };
  const margin = g => { const d = Math.abs(num(g.GF) - num(g.GA)); return d === 0 ? "Tied games" : d === 1 ? "1-goal games" : d === 2 ? "2-goal games" : d <= 4 ? "3–4 goal games" : "5+ goal games"; };
  // Game of the day: counts every game on the schedule that day (so a 2-game day still counts if one isn't entered yet)
  const dayGames = new Map(); D.team.filter(g => g._hasOpp).forEach(g => { const k = String(g.Date).trim(); if (!dayGames.has(k)) dayGames.set(k, []); dayGames.get(k).push(g); });
  const ofDay = g => { const list = (dayGames.get(String(g.Date).trim()) || [g]).sort((a, b) => a._ts - b._ts);
    return list.length < 2 ? "Only game that day" : list.indexOf(g) === 0 ? "1st game of the day" : "2nd game of the day"; };
  const timeOfDay = g => { const m = String(g.Time || "").match(/(\d+):(\d+)\s*(AM|PM)/i); if (!m) return null;
    const h = (+m[1] % 12) + (m[3].toUpperCase() === "PM" ? 12 : 0); return h < 12 ? "Morning (before noon)" : h < 17 ? "Afternoon (noon – 5 PM)" : "Evening (5 PM or later)"; };
  const stateOf = g => { const st = CFG.outOfStateRinks[splitRink(g.Rink)[0]] || (String(g.Rink).match(/,\s*([A-Z]{2})\s*$/) || [])[1] || CFG.homeState;
    return st === CFG.homeState ? "In state" : "Out of state"; };
  const oppName = new Map(); done.forEach(g => { const k = normOpp(g.Opponent); if (!oppName.has(k)) oppName.set(k, g.Opponent); });
  const byOpp = groupBy(done, g => oppName.get(normOpp(g.Opponent))).sort((a, b) => b.GP - a.GP || a.Split.localeCompare(b.Split));
  const regular = done.filter(g => /regular/i.test(g.Type || ""));
  const sections = [
    ["By Game Type", "Type", typeFilter ? [] : groupBy(done, g => g.Type || null, CFG.typeOrder)],
    ["By Tournament", "Tournament", groupBy(done.filter(g => /tournament/i.test(g.Type || "")), g => g._typeName || "Tournament")],
    ["Game of the Day", "Game", groupBy(done, ofDay, ["1st game of the day", "2nd game of the day", "Only game that day"])],
    ["Time of Day", "Start time", groupBy(done, timeOfDay, ["Morning (before noon)", "Afternoon (noon – 5 PM)", "Evening (5 PM or later)"])],
    ["In State vs Out of State", "Location", groupBy(done, stateOf, ["In state", "Out of state"])],
    ["Home vs Away (Regular Season)", "Games", groupBy(regular, g => /^h/i.test(g["Home/Away"] || "") ? "Home" : /^a/i.test(g["Home/Away"] || "") ? "Away" : null, ["Home", "Away"])],
    ["Close Games", "Margin", groupBy(done, margin, ["1-goal games", "2-goal games", "3–4 goal games", "5+ goal games", "Tied games"])],
    ["After 1 Period", "Score after 1st", groupBy(done, g => lead(g, 1), ["Leading", "Tied", "Trailing"])],
    ["After 2 Periods", "Score after 2nd", groupBy(done, g => lead(g, 2), ["Leading", "Tied", "Trailing"])],
    ["By Opponent", "Opponent", byOpp]
  ].filter(s => s[2].length);
  $("sp-tables").innerHTML = (cmp.length ? `<h2 class="sec">Wins vs Losses (Per Game)</h2><div class="card"><div class="tablewrap" id="sp-cmp"></div></div>` : "") +
    sections.map((s, i) => `<h2 class="sec">${s[0]}</h2><div class="card"><div class="tablewrap" id="sp-t${i}"></div></div>`).join("");
  if (cmp.length) table($("sp-cmp"), cmpCols, cmp, { center:true });
  sections.forEach((s, i) => table($("sp-t" + i), splitCols(s[1]), s[2], { center:true }));
  $("sp-key").innerHTML = "";
}

/* ----- Game Center -----
   Head-to-Head and Previous Meetings always cover every game against this opponent.
   Upcoming game: the skater, goalie and penalty tables also cover every game against the opponent.
   Finished game: the skater, goalie and penalty tables cover only that one game.
   (Ignores the game-type filter.) */
function renderGameCenter() {
  const g = D.team.find(x => x._key === currentGC);
  if (!g) { currentGC = null; showView("schedule"); return; }
  const opp = g.Opponent, nk = normOpp(opp), sameOpp = r => normOpp(r.Opponent) === nk;
  const meet = D.team.filter(x => x._played && sameOpp(x)).sort((a, b) => b._ts - a._ts);
  const cnt = c => meet.filter(x => x._code === c).length;
  const gp = meet.length, won = cnt("W");
  const gf = meet.reduce((s, x) => s + num(x.GF), 0), ga = meet.reduce((s, x) => s + num(x.GA), 0);

  // Which player rows feed the tables below
  const thisGame = r => sameOpp(r) && String(r.Game).trim() === String(g.Game).trim();
  const scope = g._played ? thisGame : sameOpp;
  const skIn = D.skaters.filter(scope), goIn = D.goalies.filter(scope), penRows = D.penalties.filter(scope);
  const pimAll = D.penalties.filter(sameOpp).reduce((s, r) => s + num(r.PIM), 0);   // Head-to-Head tile: all games
  const pimScope = penRows.reduce((s, r) => s + num(r.PIM), 0);
  const tag = g._played ? "This Game" : `vs ${esc(opp)}`;
  const noneFor = what => g._played ? `No ${what} recorded for this game.` : `No ${what} against ${esc(opp)}.`;

  const when = esc(longDate(g.Date)) + (!isTBD(g.Time) ? ` &bull; ${esc(g.Time)}` : "");
  const where = [g.Game && !/^t$/i.test(String(g.Game).trim()) ? "Game " + g.Game : "", g.Rink, g["Home/Away"]].filter(Boolean).map(esc).join(" &bull; ");
  // Game type under the rink line: "Seeding", "Regular Season", or "Tournament | Vegas Winter Classic"
  const tname = g._typeName && g._typeName !== g.Type ? g._typeName : "";
  const kind = esc([g.Type, tname].filter(Boolean).join(" | "));
  const meta = `${when}<br>${where}${kind ? `<br>${kind}` : ""}`;
  const center = g._played
    ? `<div class="gc-status">FINAL${esc(g._suffix)}</div><div class="gc-score">${esc(g.GF)} – ${esc(g.GA)}</div>
       <div class="gc-meta">${meta}</div><div style="margin-top:8px">${badge(g)}</div>`
    : `<div class="gc-status">UPCOMING</div><div class="gc-score">VS</div><div class="gc-meta">${meta}</div>`;

  // Opponent badge: their logo file from CFG.teamLogos, or their initials if there's no file
  const oppInit = esc(initials(opp)), oppFiles = teamLogoFiles(opp);
  const oppBadge = oppFiles.length
    ? `<img src="${esc(oppFiles[0])}" alt="" data-init="${oppInit}" data-next="${esc(oppFiles.slice(1).join("|"))}" onerror="nextLogo(this)">`
    : oppInit;

  $("gc").innerHTML = `
    <div class="gc-hero">
      <div class="gc-team"><div class="gc-badge"><img src="${esc(CFG.logo)}" alt="" onerror="this.parentNode.classList.add('init');this.parentNode.textContent='${esc(CFG.crestText)}'"></div><div class="gc-name">${esc(CFG.teamName)}</div></div>
      <div class="gc-mid">${center}</div>
      <div class="gc-team"><div class="gc-badge${oppFiles.length ? "" : " init"}">${oppBadge}</div><div class="gc-name">${esc(opp)}</div></div>
    </div>
    ${boxScore(g, opp)}
    <h2 class="sec">Head-to-Head vs ${esc(opp)}</h2>
    <div class="stats" id="gc-stats"></div>
    <h2 class="sec">${g._played ? "All Meetings" : "Previous Meetings"}</h2>
    <div class="card"><div class="tablewrap" id="gc-meet"></div></div>
    <h2 class="sec">Skaters ${tag}</h2>
    <div class="card"><div class="tablewrap" id="gc-sk"></div></div>
    <h2 class="sec">Goalies ${tag}</h2>
    <div class="card"><div class="tablewrap" id="gc-go"></div></div>
    <h2 class="sec">Penalties ${tag}</h2>
    <p class="note">${penRows.length ? `${penRows.length} ${penRows.length === 1 ? "penalty" : "penalties"}, ${pimFmt(pimScope)} PIM ${g._played ? "in this game" : `against ${esc(opp)}`} (includes bench minors).` : ""}</p>
    <div class="card"><div class="tablewrap" id="gc-pen"></div></div>`;

  renderTiles($("gc-stats"), [
    ["Games Played", gp],
    ["Record (W-L-T-OTL)", `${won}-${cnt("L")}-${cnt("T")}-${cnt("OTL")}`],
    ["Win %", winPct(won, cnt("T"), gp)],
    ["Goals For", gf], ["Goals Against", ga], ["Goal Differential", signed(gf - ga)],
    ["Penalty Minutes", pimFmt(pimAll)]
  ]);
  table($("gc-meet"), [
    { k:"_gm", l:"Game", n:true, mid:true, f:x => esc(x.Game) },
    { k:"_ts", l:"Date", n:true, mid:true, f:x => esc(shortDate(x.Date)) },
    { k:"Home/Away", l:"Home/Away", mid:true },
    { k:"Rink", l:"Rink" },
    { k:"GF", l:"Score", n:true, mid:true, f:x => `${esc(x.GF)} – ${esc(x.GA)}` },
    { k:"_code", l:"Result", mid:true, f:x => badge(x) },
    { k:"_typeName", l:"Type" }
  ], meet, { sort:"_ts", empty:`No previous games against ${esc(opp)}.` });
  table($("gc-sk"), skaterCols(), skRows(skIn),
    { sort:"PPG", then:"P", player:"Player", center:true, empty:noneFor("skater stats") });
  table($("gc-go"), goalieCols(), goalieAgg(goIn),
    { sort:"GAA", asc:true, then:"W", player:"Player", center:true, empty:noneFor("goalie stats") });
  if (g._played) {
    // Box-score style: one row per penalty
    const list = penRows.map(r => { const b = isBench(r); return { Player: b ? "Bench" : (r.Player || "Unknown"), Jersey: b ? "" : r.Jersey, JN: b ? null : num(r.Jersey), _bench: b, Penalty: r.Penalty, Type: penType(num(r.PIM)), PIM: num(r.PIM) }; });
    table($("gc-pen"), [
      { k:"Player", l:"Player", mid:true },
      { k:"JN", l:"Jersey", n:true, mid:true, f:r => esc(r.Jersey) },
      { k:"Penalty", l:"Penalty", mid:true },
      { k:"Type", l:"Type", mid:true, f:r => esc(r.Type) },
      { k:"PIM", l:"PIM", n:true, mid:true, f:r => pimFmt(r.PIM) }
    ], list, { pen:"Player", center:true, empty:noneFor("penalties") });
  } else {
    table($("gc-pen"), penaltyCols(), penaltyAgg(penRows),
      { sort:"PIM", pen:"Player", center:true, empty:noneFor("penalties") });
  }
}

// Finished games: goals by period (and shots), then power play and game-winning goal
function boxScore(g, opp) {
  if (!g._played) return "";
  let html = "";
  if (g._per) {
    const p = g._per, ot = p.f[3] || p.a[3] || /OT|SO/.test(g._suffix), so = g._suffix.includes("SO");
    const extra = (tot, arr) => num(tot) - arr.reduce((s, x) => s + x, 0);   // shootout winner (not in the periods)
    const heads = ["", "1st", "2nd", "3rd", ...(ot ? ["OT"] : []), ...(so ? ["SO"] : []), "Final", ...(g._sf !== null && g._sa !== null ? ["Shots"] : [])];
    const line = (name, arr, tot, shots) => [esc(name), ...arr.slice(0, 3), ...(ot ? [arr[3]] : []), ...(so ? [Math.max(0, extra(tot, arr))] : []),
      `<b>${esc(tot)}</b>`, ...(g._sf !== null && g._sa !== null ? [shots] : [])];
    const rows = [line(CFG.teamName, p.f, g.GF, g._sf), line(opp, p.a, g.GA, g._sa)];
    html += `<div class="card box"><div class="tablewrap"><table><thead><tr>${heads.map((h, i) => `<th class="${i ? "mid" : ""}" style="cursor:default">${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? "mid" : "txt"}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  const facts = [];
  if (!g._per && g._sf !== null && g._sa !== null) facts.push(`Shots ${g._sf} – ${g._sa}`);
  if (g._pp) {
    facts.push(`Power play ${g._pp.ppg} for ${g._pp.ppo}`);
    const sh = timesShort(g);
    facts.push(sh ? `Penalty kill ${Math.max(0, sh - g._pp.ppga)} for ${sh}${g._pp.pko === null ? " (est.)" : ""}` : "Never shorthanded");
    if (g._pp.shg) facts.push(`Shorthanded goals ${g._pp.shg}`);
    if (g._pp.shga) facts.push(`Shorthanded goals against ${g._pp.shga}`);
  }
  if (filled(g.GWG)) {
    const r = D.skaters.find(r => sameGame(r, g) && jnum(r.Jersey) === jnum(g.GWG));
    facts.push(`Game-winning goal: ${r ? `<span class="click-name" data-player="${esc(r.Player)}">${esc(r.Player)}</span> (${esc(r.Jersey)})` : esc(g.GWG)}`);
  }
  if (!html && !facts.length) return "";
  return `<h2 class="sec">Box Score</h2>${html}${facts.length ? `<p class="note after">${facts.join(" &middot; ")}</p>` : ""}`;
}

function openGameCenter(key) {
  // Remember which page we came from so "Back" returns there (Home or Schedule)
  const from = document.querySelector(".view.active")?.id.replace("view-", "");
  if (from && from !== "gamecenter") gcReturn = from;
  currentGC = key;
  renderGameCenter();
  if (currentGC) showView("gamecenter", "#gc/" + encodeURIComponent(key));
}

function renderRoster() {
  const players = D.roster.filter(p => !isBench(p));
  const groups = ["Forwards", "Defensemen", "Goalies"].filter(g => players.some(p => groupOf(p) === g));
  const sel = $("pos-filter");
  if (posFilter && !groups.includes(posFilter)) posFilter = "";
  sel.innerHTML = `<option value="">All players</option>` + groups.map(x => `<option value="${x}"${x === posFilter ? " selected" : ""}>${x}</option>`).join("");
  sel.style.display = groups.length > 1 ? "" : "none";

  // Roster stats are full-season totals (the game-type filter is hidden on this page)
  const sk = new Map(skaterAgg(D.skaters).map(a => [a.Player, a]));
  const go = new Map(goalieAgg(D.goalies).map(a => [a.Player, a]));
  const rows = players.filter(p => !posFilter || groupOf(p) === posFilter).sort((a, b) => num(a.Jersey) - num(b.Jersey));
  $("roster").innerHTML = rows.length ? rows.map(p => {
    const s = sk.get(p.Player), g = go.get(p.Player);
    const mini = s ? `<span>GP <b>${s.GP}</b></span><span>G <b>${s.G}</b></span><span>A <b>${s.A}</b></span><span>P <b>${s.P}</b></span>`
               : g ? `<span>GP <b>${g.GP}</b></span><span>W <b>${g.W}</b></span><span>GAA <b>${g.GAA === null ? "—" : g.GAA.toFixed(2)}</b></span>` : "";
    const hand = handOf(p);
    // Goalies show just the catch value (Regular / Full Right); skaters show "Shoots L/R"
    const handLine = hand ? (isCatch(p) ? esc(hand) : `Shoots ${esc(hand)}`) : "&nbsp;";
    return `<div class="pcard" data-player="${esc(p.Player)}">
      <div class="hd"><div class="jn">${esc(p.Jersey || "#")}</div>${p.Position ? `<div class="pp">${esc(p.Position)}</div>` : ""}</div>
      <div class="bd"><div class="nm">${esc(p.Player)}</div><div class="sub">${handLine}</div><div class="mini">${mini}</div></div></div>`;
  }).join("") : `<div class="msg">Roster not available.</div>`;
}

/* ----- Player card and penalty card (shown in the pop-up) ----- */
// mid: column indexes to center, e.g. [3]
function miniTable(headers, rows, even, mid = []) {
  const cls = i => mid.includes(i) ? ' class="mid"' : "";
  return `<div class="tablewrap"><table${even ? ' class="even"' : ""}><thead><tr>${headers.map((h, i) => `<th${cls(i)} style="cursor:default">${abbr(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${cls(i)}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const mtile = (l, v) => `<div class="mtile"><div class="l">${abbr(l)}</div><div class="v">${v}</div></div>`;

function openPlayer(name, opp) {
  const vs = r => !opp || normOpp(r.Opponent) === normOpp(opp);
  const ro = D.roster.find(r => r.Player === name);
  const srows = D.skaters.filter(r => r.Player === name && vs(r)).sort((a, b) => ts(a.Date) - ts(b.Date));
  const grows = D.goalies.filter(r => r.Goalie === name && vs(r)).sort((a, b) => ts(a.Date) - ts(b.Date));
  const jersey = ro?.Jersey || srows[0]?.Jersey || grows[0]?.Jersey || "";
  let tiles = "", log = "", trend = "";
  if (srows.length) {
    const a = skaterAgg(srows)[0];
    tiles = mtile("GP", a.GP) + mtile("G", a.G) + mtile("A", a.A) + mtile("P", a.P) + mtile("+/-", signed(a.PM)) + mtile("P/GP", a.PPG.toFixed(2));
    const games = n => n + (n === 1 ? " game" : " games");
    trend = [
      `Point streak: ${a.STREAK ? games(a.STREAK) : "none"} (longest ${games(a.BEST)})`,
      `Multi-point games: ${a.MULTI}`,
      HAS.gwg ? `Game-winning goals: ${a.GWG}` : ""
    ].filter(Boolean).join(" &middot; ");
    log = miniTable(["Gm", "Date", "Opponent", "G", "A", "P", "+/-"],
      srows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), esc(r.G), esc(r.A), esc(r.P), pm(num(r[PM_KEY]))]));
  } else if (grows.length) {
    const a = goalieAgg(grows)[0];
    tiles = mtile("GP", a.GP) + mtile("Record", `${a.W}-${a.L}-${a.T}-${a.OTL}`) +
      mtile("Win %", a.WPCT === null ? "—" : Math.round(a.WPCT * 100) + "%") + mtile("GA", a.GA) + mtile("GAA", a.GAA === null ? "—" : a.GAA.toFixed(2)) +
      (HAS.sa ? mtile("SV%", svFmt(a.SVP)) : "") + mtile("SO", a.SO);
    const sv = r => filled(r.SA) && num(r.SA) ? svFmt((num(r.SA) - num(r.GA)) / num(r.SA)) : "—";
    log = HAS.sa
      ? miniTable(["Gm", "Date", "Opponent", "Dec.", "GA", "SA", "SV%"],
          grows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), decision(r) || "—", esc(r.GA), esc(r.SA) || "—", sv(r)]), false, [3, 4, 5, 6])
      : miniTable(["Gm", "Date", "Opponent", "Dec.", "GA", "MIN"],
          grows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), decision(r) || "—", esc(r.GA), esc(r.Minutes)]), false, [3]);
  } else tiles = `<div class="msg" style="width:100%">No game stats${opp ? " against " + esc(opp) : ""}.</div>`;
  const pens = D.penalties.filter(r => r.Player === name && vs(r));
  const penLine = pens.length ? `<p class="note" style="padding:8px 20px 0">Penalties: ${pens.length} for ${pimFmt(pens.reduce((s, r) => s + num(r.PIM), 0))} PIM</p>` : "";
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${playerSub(ro, jersey)}</div><h2>${esc(name)}</h2>${opp ? `<div class="mvs">vs ${esc(opp)}</div>` : ""}</div>
    <div class="mtiles">${tiles}</div>${trend ? `<p class="note" style="padding:8px 20px 0">${trend}</p>` : ""}${penLine}<div class="mlog">${log}</div>`;
  $("modal").classList.add("open");
}

// Penalty card: same header as the player card, but only penalty info (and every penalty listed)
function openPenaltyCard(name, opp) {
  const bench = name === "Bench";
  const rows = D.penalties
    .filter(r => !opp || normOpp(r.Opponent) === normOpp(opp))
    .filter(r => bench ? isBench(r) : (!isBench(r) && (r.Player || "Unknown") === name))
    .sort((a, b) => ts(a.Date) - ts(b.Date) || num(a.Game) - num(b.Game));
  const ro = bench ? null : D.roster.find(r => r.Player === name);
  const jersey = bench ? "" : (ro?.Jersey || rows[0]?.Jersey || "");
  const sub = bench ? "Bench minors" : playerSub(ro, jersey);
  const total = rows.reduce((s, r) => s + num(r.PIM), 0);
  const games = new Set(rows.map(r => r.Game)).size;
  const counts = new Map(); rows.forEach(r => counts.set(r.Penalty, (counts.get(r.Penalty) || 0) + 1));
  const common = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
  const tiles = mtile("Penalties", rows.length) + mtile("PIM", pimFmt(total)) + mtile("Games", games) + mtile("PIM / Game", games ? pimFmt(total / games) : "—");
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${sub}</div><h2>${esc(name)}</h2>${opp ? `<div class="mvs">vs ${esc(opp)}</div>` : ""}</div>
    <div class="mtiles">${tiles}</div>
    ${common ? `<p class="note" style="padding:8px 20px 0">Most common: ${esc(common[0])} (${common[1]})</p>` : ""}
    <div class="mlog">${rows.length
      ? miniTable(["Gm", "Date", "Opponent", "Penalty", "Type", "PIM"],
          rows.map(r => [esc(r.Game), esc(shortDate(r.Date)), esc(r.Opponent), esc(r.Penalty), esc(penType(num(r.PIM))), esc(r.PIM)]), true)
      : `<div class="msg">No penalties recorded${opp ? " against " + esc(opp) : ""}.</div>`}</div>`;
  $("modal").classList.add("open");
}
// Team shutout: a played game with 0 goals against
const isShutout = g => g._played && g.GA !== "" && num(g.GA) === 0;

// Shutouts popup (Home page tile), same layout as the penalty card: tiles, then a game list with who was in net
function openShutouts() {
  const all = D.team.filter(inType).filter(g => g._played), games = all.filter(isShutout);   // oldest first, like the player cards
  const inNet = g => D.goalies
    .filter(r => String(r.Game).trim() === String(g.Game).trim() && normOpp(r.Opponent) === normOpp(g.Opponent))
    .map(r => esc(String(r.Goalie).trim().split(/\s+/).pop())).join("<br>") || "—";   // last names keep the popup narrow
  const gfTotal = games.reduce((s, g) => s + num(g.GF), 0);
  const tiles = mtile("Shutouts", games.length) + mtile("Games Played", all.length) +
    mtile("Shutout %", all.length ? Math.round(games.length / all.length * 100) + "%" : "—") +
    mtile("Goals For / Game", games.length ? (gfTotal / games.length).toFixed(2) : "—");
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${esc(typeFilter || "All games")} &bull; ${esc(CFG.season)}</div><h2>Team Shutouts</h2></div>
    <div class="mtiles">${tiles}</div>
    <div class="mlog">${games.length
      ? miniTable(["Gm", "Date", "Opponent", "Score", "Result", "In Net"],
          games.map(g => [esc(g.Game), esc(shortDate(g.Date)), vs(g), `${esc(g.GF)} – ${esc(g.GA)}`, badge(g), inNet(g)]), true).replace('class="even"', 'class="even so"')
      : `<div class="msg">No shutouts yet.</div>`}</div>`;
  $("modal").classList.add("open");
}
const closeModal = () => $("modal").classList.remove("open");

/* Stat definitions popup: what each stat on the current page means and how it's calculated */
const DEF = {
  record: ["Record (W-L-T-OTL)", "Wins - Losses - Ties - Overtime and shootout losses."],
  winpct: ["Win %", "(Wins + ½ × Ties) ÷ Games Played. A tie counts as half a win; an overtime or shootout loss counts as a loss. Goalies: divided by their decisions instead of games played."],
  gd:     ["Goal Differential", "Goals For − Goals Against."],
  pim:    ["Penalty Minutes (PIM)", "Minor 1.5 · Major 4 · Misconduct 8. Team totals include bench minors."],
  gp:     ["GP", "Games Played."],
  g:      ["G / A / P", "Goals / Assists / Points. Points = Goals + Assists."],
  pm:     ["+/- (Plus/Minus)", "+1 for being on the ice for an even-strength or shorthanded goal for, −1 for one against. Power-play goals and penalty shots don't count."],
  gwg:    ["GWG (Game-Winning Goal)", "The goal that put the Dawgs ahead for good in a win. In a 5-2 win, the 3rd Dawgs goal."],
  ppg:    ["P/GP (Points Per Game)", "Points ÷ Games Played."],
  streak: ["Active Point Streak", "Games in a row, counting only games the player played, with at least one point. Ends with any game without a point."],
  multi:  ["Multi-Point Game", "A game with 2 or more points."],
  dec:    ["Decision (Dec.)", "The goalie credited with the team's W, L, T or OTL. Each game has one decision; the other goalie gets no decision (—)."],
  ga:     ["GA / MIN", "Goals Against / Minutes Played."],
  gaa:    ["GAA (Goals-Against Average)", `Goals Against × ${CFG.gameMinutes} ÷ Minutes Played: goals allowed per full ${CFG.gameMinutes}-minute game (three 13-minute periods).`],
  sa:     ["SA (Shots Against)", "Shots on goal faced."],
  sv:     ["SV% (Save Percentage)", "(Shots Against − Goals Against) ÷ Shots Against. .900 means 9 of every 10 shots stopped. Only games with shots entered count."],
  so:     ["SO (Shutout)", "Goalie: played the whole game and allowed 0 goals. Team: any game with 0 goals against (shared between goalies counts for the team only)."],
  pp:     ["Power Play % (PP%)", "Power-play goals ÷ power-play chances (times the other team took a penalty that put the Dawgs a player up)."],
  pk:     ["Penalty Kill % (PK%)", "1 − (Power-play goals against ÷ times shorthanded). 80% means the other team scored on 1 of every 5 power plays."],
  sh:     ["Shorthanded Goals", "Goals scored by the team that's a player down. For: the Dawgs scored while killing a penalty. Against: the other team scored while the Dawgs were on the power play."],
  shots:  ["Shots / Game", "Shots on goal per game. A shot that misses the net or is blocked doesn't count."],
  shpct:  ["Shooting %", "Goals ÷ Shots on goal. 20% means 1 of every 5 shots goes in."],
  tsv:    ["Team Save %", "(Shots Against − Goals Against) ÷ Shots Against for both goalies together."],
  pergp:  ["GF/GP, GA/GP, SF/GP, SA/GP, PIM/GP", "Goals for, goals against, shots for, shots against and penalty minutes per game."],
  diff:   ["Diff", "Goal differential: GF − GA."],
  close:  ["Close Games", "Grouped by final margin (the difference in the final score): 1 goal, 2 goals, 3–4 goals or 5+ goals. Overtime and shootout games count as 1-goal games."],
  ofday:  ["Game of the Day", "On days with two games, whether it was the 1st or 2nd game that day."],
  tod:    ["Time of Day", "By start time: morning (before noon), afternoon (noon to 5 PM), evening (5 PM or later)."],
  state:  ["In State vs Out of State", "Games at Utah rinks vs out-of-state tournaments."],
  ha:     ["Home vs Away", "Regular-season games only. At tournaments, home/away mostly decides jersey color."],
  after:  ["After 1 / 2 Periods", "The team's record when leading, tied or trailing after the 1st or 2nd period."],
  results:["Results", "W win · L loss · T tie · OTL overtime or shootout loss (orange). (OT) or (SO) after a W means it was won in overtime or a shootout."],
  type:   ["Type", "Seeding, Regular Season, or the tournament's name for tournament games."],
  h2h:    ["Head-to-Head", "Every game against this opponent this season."],
  box:    ["Box Score", "Goals by period and shots on goal. Power play 1 for 4 = 1 goal on 4 chances. Penalty kill 5 for 6 = killed 5 of 6 penalties."],
  pos:    ["Position", "F forward · D defense · G goalie."],
  hand:   ["Shoots / Catches", "Skaters: L or R. Goalies: Regular (catches with the left hand) or Full Right."]
};
const DEF_PAGES = {
  home:       ["Home", [["Team", ["record", "winpct", "gd", "pim", "so"]], ["Recent Form", [["Streak", "Results in a row from the latest game: W2 = 2 wins in a row, L1 = lost the last game."], ["Last 5", "Record (W-L-T-OTL) in the 5 most recent games."]]],
                         ["Skater Leaders", ["g", "ppg", "pm", "gwg", "streak"]], ["Goalie Leaders", ["gaa", "sv"]]]],
  schedule:   ["Schedule", [["Schedule", ["results", "type"]]]],
  stats:      ["Stats", [["Skaters", ["gp", "g", "pm", "gwg", "ppg"]], ["Goalies", ["record", "winpct", "dec", "ga", "gaa", "sa", "sv", "so"]], ["Penalties", ["pim"]]]],
  splits:     ["Splits", [["Special Teams & Shots", ["pp", "pk", "sh", "shots", "shpct", "tsv"]],
                          ["Tables", ["pergp", "diff", "record", "winpct", "close", "ofday", "tod", "state", "ha", "after"]]]],
  roster:     ["Roster", [["Players", ["pos", "hand", "gp", "g"]], ["Player Cards", ["streak", "multi", "gwg"]]]],
  gamecenter: ["Game Center", [["Game Center", ["box", "h2h", "record", "winpct"]], ["Tables", ["gp", "g", "pm", "gwg", "ppg", "dec", "gaa", "sv", "pim"]]]]
};
function openDefs() {
  const id = (document.querySelector(".view.active")?.id || "view-home").replace("view-", "");
  const [name, groups] = DEF_PAGES[id] || DEF_PAGES.home;
  $("mbody").innerHTML = `<div class="mhead"><div class="mj">${esc(name)}</div><h2>Stat Definitions</h2></div><div class="defs">${groups.map(([title, items]) =>
    `<h3>${esc(title)}</h3>${items.map(it => { const [t, d] = typeof it === "string" ? DEF[it] : it; return `<div class="d"><b>${esc(t)}</b><span>${esc(d)}</span></div>`; }).join("")}`).join("")}</div>`;
  $("modal").classList.add("open");
}

/* =====================================================
   NAV / INIT
   ===================================================== */
function showView(id, hash) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + id));
  const navId = id === "gamecenter" ? gcReturn : id;    // Game Center keeps the page you came from highlighted
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.v === navId));
  $("filterWrap").style.display = (id === "roster" || id === "gamecenter") ? "none" : "";   // game-type filter hidden on Roster / Game Center
  history.replaceState(null, "", hash || "#" + id);
  window.scrollTo(0, 0);
}

function buildNav() {
  const items = [["home","Home"],["schedule","Schedule"],["stats","Stats"],["splits","Splits"],["roster","Roster"]];
  $("nav").innerHTML = items.map(([id, l]) => `<button data-v="${id}">${l}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { currentGC = null; showView(b.dataset.v); });
  const h = location.hash;
  if (h.startsWith("#gc/")) {                              // a shared Game Center link: open it once the data has loaded
    try { pendingGC = decodeURIComponent(h.slice(4)); } catch (e) {}
    gcReturn = "schedule";
    showView("schedule");
  } else {
    const start = h.slice(1);
    showView(items.some(i => i[0] === start) ? start : "home");
  }
}

function renderAll() {
  POS = new Map(D.roster.filter(p => !isBench(p)).map(p => [p.Player, p.Position || ""]));
  renderTicker(); renderHome(); renderSchedule(); renderSkaters(); renderGoalies(); renderPenalties(); renderSplits(); renderRoster();
  if (currentGC) renderGameCenter();
}

function buildTypeFilter() {
  const rank = t => { const i = CFG.typeOrder.findIndex(x => normOpp(x) === normOpp(t)); return i < 0 ? CFG.typeOrder.length : i; };
  const types = [...new Set(D.team.map(g => g.Type).filter(Boolean))].map((t, i) => [t, i])
    .sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);   // listed order first, then sheet order
  const sel = $("typeFilter");
  sel.innerHTML = `<option value="">All games</option>` + types.map(t => `<option value="${esc(t)}"${t === typeFilter ? " selected" : ""}>${esc(t)}</option>`).join("");
  sel.style.display = types.length > 1 ? "" : "none";
}

async function loadAll() {
  const keys = Object.keys(CFG.tabs);
  const results = await Promise.allSettled(keys.map(k => loadTab(CFG.tabs[k])));
  const failed = [];
  results.forEach((r, i) => { if (r.status === "fulfilled") D[keys[i]] = r.value; else failed.push(CFG.tabs[keys[i]]); });
  D.team = prepGames(D.team);
  detectColumns();
  $("banner").innerHTML = failed.length
    ? `<div class="card" style="margin-bottom:14px"><div class="msg err">Couldn't load: ${failed.map(esc).join(", ")}. Check the tab names and that the sheet is shared as "Anyone with the link can view".</div></div>` : "";
  buildTypeFilter();
  renderAll();
  if (pendingGC) {
    const k = pendingGC; pendingGC = null;
    if (D.team.some(g => g._key === k)) openGameCenter(k);
  }
  $("footer").textContent = `Unofficial team stats site • Updated ${new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })}`;
}

/* Logo (falls back to the "UD" circle if the image isn't found) + favicon */
const logoEl = $("logo");
logoEl.onerror = () => { logoEl.style.display = "none"; $("crest").style.display = "grid"; };
logoEl.src = CFG.logo;
const fav = document.createElement("link"); fav.rel = "icon"; fav.href = CFG.logo; document.head.appendChild(fav);

$("teamName").textContent = CFG.teamName;
$("crest").textContent = CFG.crestText;
$("seasonLabel").textContent = CFG.season;
$("typeFilter").onchange = e => { typeFilter = e.target.value; renderAll(); };
$("pos-filter").onchange = e => { posFilter = e.target.value; renderRoster(); };
$("search-stats").oninput = applySearch;
$("gc-back").onclick = () => { currentGC = null; showView(gcReturn); };
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); $(j.dataset.jump).scrollIntoView({ behavior:"smooth", block:"start" }); return; }
  const gm = e.target.closest("[data-game]");
  if (gm && gm.dataset.game) { closeModal(); openGameCenter(gm.dataset.game); return; }
  const op = e.target.closest("[data-open]");
  if (op && op.dataset.open === "shutouts") { openShutouts(); return; }
  const ld = e.target.closest("[data-leaders]");
  if (ld) { openLeaders(ld.dataset.leaders); return; }
  // Cards opened from inside the Game Center only show that opponent
  const inGC = e.target.closest("#view-gamecenter");
  const gcOpp = inGC ? D.team.find(x => x._key === currentGC)?.Opponent : null;
  const pn = e.target.closest("[data-pen]");
  if (pn && pn.dataset.pen) { openPenaltyCard(pn.dataset.pen, gcOpp); return; }
  const p = e.target.closest("[data-player]");
  if (p && p.dataset.player) openPlayer(p.dataset.player, gcOpp);
});
$("ticker-scroll").addEventListener("scroll", tickerFade, { passive:true });
window.addEventListener("resize", tickerFade);
$("mclose").onclick = closeModal;
$("info-btn").onclick = openDefs;
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

buildNav();
loadAll();
setInterval(loadAll, CFG.refreshMinutes * 60000);
</script>
</body>
</html>
